};

/* Payment card — the prototype's five states. Whether a reference is already
   used is the server's call (DUPLICATE_TXN_REF), never guessed here. */
function payVals(p){
  const isAdmin = S.session.role === 'admin';
  const v = p.payment || {};
  const when = v.at ? ' at ' + fmtIso(v.at) : '';
  const status = p.payment_status === 'verified' && v.skip_reason ? 'skipped' : p.payment_status;
  const defs = {
    submitted:{ pill:['#1F7A4C','#fff','Screenshot in'], card:'#1F7A4C', fg:'#fff',
      title:'Screenshot accepted',
      body:'They uploaded a screenshot at sign-up, and that counts on its own — the counter can hand over ' + listOf(S.items.map(i => i.label.toLowerCase())) + ', once each. Look at it above if you want to; reject it only if it is wrong.',
      open:true },
    verified:{ pill:['#1F7A4C','#fff','Paid'], card:'#1F7A4C', fg:'#fff',
      title:'Marked paid',
      body:'Recorded by ' + (v.by || 'an admin') + when + (v.txn_ref ? ' against reference ' + v.txn_ref : '') + (v.reason ? ': "' + v.reason + '"' : '') + '. The counter can hand over ' + listOf(S.items.map(i => i.label.toLowerCase())) + ', once each.',
      open:false },
    skipped:{ pill:['#1F7A4C','#fff','Payment verified'], card:'#1F7A4C', fg:'#fff',
      title:'Verified without a reference',
      body:'Recorded by ' + (v.by || 'an admin') + when + ': the screenshot shows no reference number' + (v.skip_reason ? ' ("' + v.skip_reason + '")' : '') + '. This payment is not covered by the reference check.',
      open:false },
    rejected:{ pill:['#A8231B','#fff','Payment rejected'], card:'#A8231B', fg:'#fff',
      title:'Rejected',
      body:'Rejected by ' + (v.by || 'an admin') + when + (v.reason ? ': "' + v.reason + '"' : '') + '. The bot has told them to see the front desk. Their pass still scans so the counter can find them, but nothing can be handed over.',
      open:false },
    missing:{ pill:['#AE7338','#101010','No screenshot'], card:'#AE7338', fg:'#101010',
      title:'No screenshot',
      body:'They signed up without one, so the booth sees an amber card and can hand nothing over. Take the money at the front desk, then mark it paid here.',
      open:true }
  };
  // Payments are not being checked (STATE.md 138): the screenshot is here to
  // look at, not to approve, so nothing on this card asks for a decision.
  if (p.payment_required === false){
    const d0 = defs[status] || defs.submitted;
    const seen = { submitted:'They uploaded a screenshot at sign-up.',
                   missing:'They signed up without a screenshot.',
                   rejected:'Marked rejected earlier, before checking was switched off.' };
    return {
      pillBg:d0.pill[0], pillFg:d0.pill[1], pillLabel:d0.pill[2],
      card:'#3C4654', fg:'#fff', title:'Nothing to check',
      body:(seen[status] || 'Recorded at sign-up.')
           + ' Payments are not being checked tonight, so everyone on the list can collect. '
           + 'The screenshot above is here if you want to look.',
      open:false, settled:false, canMarkPaid:false
    };
  }
  const d = defs[status] || defs.submitted;
  return {
    pillBg:d.pill[0], pillFg:d.pill[1], pillLabel:d.pill[2],
    card:d.card, fg:d.fg, title:d.title, body:d.body,
    open:d.open && isAdmin, settled:!d.open && isAdmin,
    // Only somebody with no screenshot needs marking paid. A screenshot
    // already counts, so offering it there would just be a second name for
    // "leave it alone".
    canMarkPaid: status === 'missing'
  };
}

/* §9 r30, layers one and two. These warn and nothing else: no payment is
   changed, nothing is blocked, and the admin still decides. Two people can
   honestly send the same screenshot (one paid for both), so the wording asks
   a question rather than making an accusation. */
function dupWarning(p){
  const d = p.duplicates || { exact:[], similar:[] };
  if (!d.exact.length && !d.similar.length) return '';
  // Buttons, not links: the existing [data-person] handler opens that person
  // in place, and an href would scroll the page to the top on the way.
  const who = list => list.map(x =>
    `<button type="button" data-person="${x.id}">${esc(x.name)}</button> (@${esc(x.handle)})`).join(', ');
  let out = '';
  if (d.exact.length){
    out += `<div class="dupwarn exact">
      <div class="t">The same screenshot is on ${d.exact.length} other record${d.exact.length > 1 ? 's' : ''}</div>
      <div>Byte for byte identical to ${who(d.exact)}. That is one payment unless
      they tell you otherwise — check the reference before verifying either.</div></div>`;
  }
  if (d.similar.length){
    out += `<div class="dupwarn">
      <div class="t">Looks like ${d.similar.length} other screenshot${d.similar.length > 1 ? 's' : ''}</div>
      <div>Close to ${who(d.similar)}. Screens from the same bank do look alike,
      so this may be nothing — the reference is what settles it.</div></div>`;
  }
  return out;
}

/* The changeover ticks used to live only in memory, so a reload in the middle
   of a reset — which is what a phone does when you unlock it — threw away
   what had already been done. They are per-device and per-game, so
   localStorage is the right size of promise: it survives a reload, it never
   claims to be shared with the other GM, and losing it costs one glance at
   the room. */
function loadResetDone(){
  try { return JSON.parse(localStorage.getItem('yard_reset') || '{}') || {}; }
  catch (e){ return {}; }
}
function saveResetDone(){
  try { localStorage.setItem('yard_reset', JSON.stringify(S.resetDone)); } catch (e){}
}

/* The four words the whole console uses for where a game is. They come from
   the server (game._games), so the picker, the card and the timetable can
   never disagree about what a game is doing — which they did, in three
   different vocabularies, until 23 Sep. */
const GAME_STATE = { in_progress:'In progress', finished:'Finished', upcoming:'Upcoming', blocked:'Blocked' };

SCREENS.gm = function(){
  const d = S.gmState;
  if (!d) return S.gmError ? `<div class="blocked"><div class="t">No game yet</div><div class="b">${esc(S.gmError)}</div></div>` : loading();
  const elapsed = gmElapsed(d);
  const remaining = Math.max(0, d.game_seconds - elapsed);
  const timerTone = !d.started ? '#A8A29B' : remaining <= 120 ? '#C4A98A' : '#F2EFE8';

  /* A hint each, and one button. Nothing is due, nothing goes amber on a
     timer: the game master watches the room and gives one when the room
     needs one. Given ones stay in the list, quiet, with the time on them,
     so it is obvious what has already been used. */
  const hintRow = (h) => `<div class="hint ${h.given ? 'given' : ''}">
    <div class="body">
      <div class="h">${esc(h.title || 'Hint')}</div>
      <div class="line">${esc(h.line)}</div>
    </div>
    <button class="act" data-hint="${esc(h.key)}" ${h.given ? 'disabled' : ''}>${
      h.given ? esc('Given ' + (h.given_at ? short(h.given_at) : '')) : 'Give it'}</button>
  </div>`;
  const main = d.hints.filter(h => !h.optional), extra = d.hints.filter(h => h.optional);

  /* Everyone in the game gets the phone by bot message (decision 130), so
     the GM needs to see whose arrived — anyone it can't reach gets the desk
     handset instead. */
  const PM = { sent:'Phone sent', waiting:'Phone on its way', unreachable:'Can\'t reach — desk handset', held:'Not sent (test mode)' };
  const rows = d.people.length ? d.people.map((p, i) => `<div class="prow ${p.in ? '' : 'out'}">
      <span class="n">${i + 1}</span>
      <span class="who">${esc(p.name)}<span class="at">@${esc(p.handle)}</span>${
        p.phone_msg ? `<span class="pm ${p.phone_msg === 'unreachable' || p.phone_msg === 'held' ? 'bad' : ''}">${esc(PM[p.phone_msg] || p.phone_msg)}</span>` : ''}</span>
      <span class="tick">${p.in ? 'Here' : 'Not in yet'}</span>
    </div>`).join('')
    : `<div class="gm-note">Nobody is booked on this game.</div>`;
  const missed = d.people.filter(p => p.phone_msg === 'unreachable' || p.phone_msg === 'held');
  const phoneLine = !d.people.some(p => p.phone_msg) ? ''
    : missed.length
      ? `<div class="gm-phone bad">Kai Chen's phone can't reach ${esc(missed.map(p => p.name).join(', '))}. ${missed.some(p => p.phone_msg === 'held') ? 'Messages are on testing — Settings → Who gets messages → Everyone. ' : ''}Hand them the desk handset, or let them share with their group.</div>`
      : `<div class="gm-phone">Everyone in this game has been sent Kai Chen's phone.</div>`;

  const games = d.games.map(g => `<option value="${g.id}" ${g.id === d.slot_id ? 'selected' : ''}>${esc(short(g.starts_at))} · ${esc(g.booked)} booked · ${esc(GAME_STATE[g.state] || g.state)}</option>`).join('');

  /* One status line instead of three. What the game is doing, what the phone
     is doing, and how many people have it — read left to right, once. */
  const phone = d.phone_locked ? 'phone locked by you'
    : d.phone_open ? 'phone open until ' + short(d.relock_at)
    : d.state === 'finished' ? 'phone closed'
    : 'phone opens at ' + short(d.starts_at);
  const got = d.people.filter(p => p.phone_msg === 'sent').length;
  const bits = [esc(GAME_STATE[d.state] || d.state), esc(phone)];
  // Only once something has gone out. Before the booked time "0 of 6 have
  // it" reads as a problem, when nothing has been sent yet by design.
  if (d.booked && d.people.some(p => p.phone_msg)) bits.push(esc(got + ' of ' + d.booked + ' have it'));

  /* The one big button. There is no Start any more, so before the booked
     time it says when the game begins rather than asking for a press that
     does not exist. */
  const run = d.ended
    ? `<button class="gm-btn gm-pause wide" disabled>Finished</button>`
    : !d.started ? `<button class="gm-btn gm-pause wide" disabled>Starts ${esc(short(d.starts_at))}</button>`
    : `<button class="gm-btn gm-pause wide ${d.paused ? 'on' : ''}" data-gm="${d.paused ? 'resume' : 'pause'}">${d.paused ? 'Resume' : 'Pause'}</button>`;

  return `
  <div class="phone390 gm">
    <div class="gm-top">
      <span class="who">GM · ${esc(S.session.name)}</span>
      <select class="gm-pick" id="gmpick" aria-label="Game">${games}</select>
    </div>
    <div class="gm-body">
      <div class="gm-card">
        <div class="gm-head">
          <span class="l">${esc(short(d.starts_at))} — game ${esc(d.game_number)} of ${esc(d.games_total)}</span>
          ${d.next_game_at && d.state !== 'upcoming' ? `<span class="gm-next" id="gmnext">Next ${esc(short(d.next_game_at))}</span>` : ''}
        </div>
        <div class="gm-timer" id="gmtimer" style="color:${timerTone}">${esc(mmss(remaining))}</div>
        <div class="gm-status">${bits.join('<span class="sep">·</span>')}</div>
        ${run}
        <div class="gm-grid">
          <button class="gm-btn gm-ext" data-gm="shorten" ${d.ended || remaining <= 60 ? 'disabled' : ''}>−1 min</button>
          <button class="gm-btn gm-ext" data-gm="extend" ${d.ended ? 'disabled' : ''}>+1 min</button>
        </div>
        <div class="gm-rare">
          <button class="gm-btn gm-lock ${d.phone_locked ? 'on' : ''}" data-gm="${d.phone_locked ? 'unlock' : 'lock'}">${d.phone_locked ? 'Unlock the phone' : 'Lock the phone'}</button>
          ${d.started && !d.ended ? `<button class="gm-btn gm-end" data-gm="end">End game</button>` : ''}
        </div>
        <div class="gm-note">${d.phone_locked
          ? 'You have locked Kai Chen\'s phone for this game. Unlock gives it back to everyone booked.'
          : 'The game runs itself: it starts at the booked time and Kai Chen\'s phone opens then too, for everyone in it. Pause if something happens — it holds the phone open for as long as you are paused.'}</div>
        ${phoneLine}
      </div>

      <div class="gm-card tight">
        <div class="l kicker" style="color:#A8A29B">Hints</div>
        ${main.map(hintRow).join('') || `<div class="gm-note">No hint file on this laptop (private\\gm\\script.json).</div>`}
        ${extra.length ? `<div class="l kicker" style="color:#A8A29B;margin-top:4px">If they are still stuck</div>${extra.map(hintRow).join('')}` : ''}
        ${d.hints.length ? `<div class="gm-note">${d.actor_ready ? 'Giving a hint sends the line to the actor\'s Telegram.' : 'No actor registered, so read the line out yourself. The actor sends /actor and the GM PIN to the bot to get them.'}</div>` : ''}
      </div>

      <div class="gm-card tight">
        <div class="l kicker" style="color:#A8A29B">In this game — ${esc(d.booked)} booked, ${esc(d.checked_in)} checked in</div>
        ${rows}
      </div>

      <div class="gm-card tight">
        <div class="l kicker" style="color:#A8A29B">Changeover — ${esc(d.changeover_minutes)} minutes</div>
        ${d.reset.map((r, i) => `<div class="reset-row">
          <button class="reset-box ${S.resetDone[d.slot_id + ':' + i] ? 'done' : ''}" data-reset="${d.slot_id}:${i}" aria-label="Done"></button>
          <span>${esc(r)}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
};

/* Seconds played, counted on this device from the server's figure. */
function gmElapsed(d){
  if (!d.started || d.paused || d.ended) return d.elapsed_seconds;
  return d.elapsed_seconds + Math.floor((Date.now() - S.gmAt) / 1000);
}

SCREENS.schedules = function(){
  const d = S.slots;
  if (!d) return loading();
  const esc_ = d.escape, jam = d.jam;
  const gameRow = (s) => {
    const pct = Math.round(s.booked / s.capacity * 100);
    const tone = s.blocked ? '#A8231B' : s.running ? '#AE7338' : s.booked >= s.capacity ? '#A8231B' : '#101010';
    const state = s.blocked ? 'Blocked' : s.running ? 'Running now' : s.done ? 'Done'
      : s.booked >= s.capacity ? 'Full' : s.closed ? 'Booking closed' : 'Open';
    const pillBg = s.blocked ? '#A8231B' : s.running ? '#AE7338' : s.done ? '#3C4654'
      : s.booked >= s.capacity ? '#101010' : '#8FA65B';
    const pillFg = (s.blocked || s.done) ? '#fff' : '#101010';
    return `<div class="trow ${s.blocked ? 'blocked' : ''}">
      <span class="time">${esc(short(s.starts_at))}</span>
      <span>
        <span class="seatbar"><i class="${s.running ? 'now' : s.booked >= s.capacity ? 'full' : ''}"
              style="width:${pct}%;background:${tone}"></i></span>
        <span style="font-size:12px;color:#3C4654;display:block;margin-top:5px">${esc(s.booked)} of ${esc(s.capacity)} booked · ${esc(s.checked_in)} checked in</span>
      </span>
      <span class="statepill" style="background:${pillBg};color:${pillFg}">${esc(state)}</span>
      <span class="acts">
        ${s.booked ? `<button class="smallbtn" data-move="${s.id}">Move someone</button>` : ''}
        <button class="smallbtn ${s.blocked ? '' : 'danger'}" data-block="${s.id}" data-blocked="${s.blocked ? 1 : 0}">${s.blocked ? 'Unblock' : 'Block'}</button>
      </span>
    </div>`;
  };
  const jamRow = (s) => {
    const state = s.blocked ? 'Blocked' : s.status === 'open' ? 'Open' : s.status === 'past' ? 'Past' : 'Booked';
    const pillBg = s.blocked ? '#A8231B' : s.status === 'open' ? '#8FA65B' : s.status === 'past' ? '#3C4654' : '#3B32C4';
    const pillFg = (s.status === 'open') ? '#101010' : '#fff';
    return `<div class="trow ${s.blocked ? 'blocked' : ''}">
      <span class="time">${esc(short(s.starts_at))}</span>
      <span style="font-size:13px;color:#3C4654">${esc(short(s.starts_at))}–${esc(short(s.ends_at))} · free${s.ref ? ' · ' + esc(s.ref) : ''}${
        s.booked ? ' · ' + esc(s.booked) + ' of ' + esc(s.capacity) : ''}</span>
      <span class="statepill" style="background:${pillBg};color:${pillFg}">${esc(state)}</span>
      <!-- The booker first, then who they brought: staff at the door look for
           the name on the booking, then count heads against the party. -->
      <span class="party" title="${esc((s.party || []).join(', '))}">${
        s.who ? esc(s.who) + (s.booked > 1 ? ' +' + esc(s.booked - 1) : '') : '—'}</span>
      <span class="acts">
        <button class="smallbtn ${s.blocked ? '' : 'danger'}" data-block="${s.id}" data-blocked="${s.blocked ? 1 : 0}">${s.blocked ? 'Unblock' : 'Block'}</button>
      </span>
    </div>`;
  };
  return `
  <div class="wide">
    <div class="sub">
      <span class="t">Schedules</span>
      <span class="m">${esc(esc_.length)} games · ${esc(d.seats_taken)} of ${esc(d.seats_total)} seats · ${esc(jam.length)} jam slots${
        d.jam_seats_taken ? ' · ' + esc(d.jam_seats_taken) + ' jamming' : ''}</span>
    </div>
    <div class="sched">
      <div>
        <h3>The Last Guest</h3>
        <div class="lead">Every 20 minutes from ${esc(esc_.length ? short(esc_[0].starts_at) : '—')} to ${esc(esc_.length ? short(esc_[esc_.length - 1].starts_at) : '—')} PM, ${esc(esc_.length ? esc_[0].capacity : 12)} a game. Blocking a game hides it from the attendee board straight away. People already booked stay booked — move them first.</div>
      </div>
      <div class="table">
        <div class="trow head"><span>Start</span><span>Seats</span><span>State</span><span>Who</span><span></span></div>
        ${esc_.map(gameRow).join('')}
      </div>
      <div>
        <h3>Jamming studio</h3>
        <div class="lead">Free 30-minute slots, booked as a group like the escape room. The room belongs to whoever booked it for that slot — another group is never seated alongside them — and it does not have to fill. A slot cannot overlap anyone in the group's escape game, counting 5 minutes to walk either side.</div>
      </div>
      <div class="table">
        <div class="trow head"><span>Start</span><span>Slot</span><span>State</span><span>Who</span><span></span></div>
        ${jam.length ? jam.map(jamRow).join('') : `<div class="trow"><span></span><span style="color:#3C4654">No jam slots yet — run python manage.py generate-slots.</span></div>`}
      </div>
    </div>
  </div>`;
};

/* ---- Settings ------------------------------------------------------- */

/* One control per idea, in plain words (22 Sep, decision 129). The
   organiser's example: "event-day mode", "test clock" and "test clock set
   to" were three controls, one forcing another off, and none said what it
   did. They became one Real time / Test time switch and a slider. The same
   rule runs through the rest of this screen: a choice shows every option at
   once; nothing secretly means "off" (stock 0 used to); a value that does
   not apply right now is dimmed, not explained in small print. Rows that
   were already plain were left as they were. */

/* "19:30" -> "7:30 PM". */
function hhmmLabel(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
  if (!m) return String(t || '');
  const h = Number(m[1]);
  return (h % 12 || 12) + ':' + m[2] + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function toMins(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
  return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
}
function fromMins(n){
  n = Math.max(0, Math.min(1439, Math.round(n)));
  return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
}
/* "Thu 24 Sep" — the day Test time pretends it is (the server's EVENT_DATE). */
function eventDayLabel(){
  const iso = (S.session && S.session.event_date) || '2026-09-24';
  const d = new Date(iso + 'T12:00:00');
  // Built by hand: browsers disagree on "Sep" and "Sept".
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate() + ' '
    + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
function testTimeLabel(t){ return eventDayLabel() + ', ' + hhmmLabel(t); }
/* Stock 0 is how the server stores "not counted"; '' is "counted, number
   not typed yet". */
function countOn(n){ return !(n === 0 || n === '0' || n === null || n === undefined); }
function settingValue(key){
  return (key in S.settingsDraft) ? S.settingsDraft[key] : S.settings.values[key];
}
function handlesOf(list){
  return String(list || '').split(',').map(h => h.trim()).filter(Boolean).map(h => '@' + h).join(', ') || 'test accounts';
}

/* The whole evening of the 24th, a minute a step: from an hour before the
   doors-open message to an hour after close, stretched if the saved time
   sits outside that. */
function testRange(v){
  const cur = toMins(v('test_clock_at'));
  const lo = Math.max(0, Math.min(toMins(v('doors_message_at')) - 60, cur));
  const hi = Math.min(1439, Math.max(toMins(v('doors_close')) + 60, cur));
  return [lo, hi];
}
function timeSlider(key, val, range, off){
  const [lo, hi] = range;
  const dis = off ? 'disabled tabindex="-1"' : '';
  return `<div class="tslide">
      <div class="read"><small>${esc(eventDayLabel())}</small><span data-read="${key}">${esc(hhmmLabel(val))}</span></div>
      <div class="tbar">
        <button class="nudge" data-nudge="${key}" data-by="-1" aria-label="One minute earlier" ${dis}>−1</button>
        <input type="range" min="${lo}" max="${hi}" step="1" value="${toMins(val)}" data-set="${key}" data-type="slider" aria-label="Test time" ${dis}>
        <button class="nudge" data-nudge="${key}" data-by="1" aria-label="One minute later" ${dis}>+1</button>
      </div>
      <div class="ends"><span>${esc(hhmmLabel(fromMins(lo)))}</span><span>${esc(hhmmLabel(fromMins(hi)))}</span></div>
    </div>`;
}

SCREENS.settings = function(){
  const d = S.settings;
  if (!d) return loading();
  const v = k => (k in S.settingsDraft) ? S.settingsDraft[k] : d.values[k];
  const dirty = Object.keys(S.settingsDraft).filter(k => String(S.settingsDraft[k]) !== String(d.values[k]));

  // Every option visible; the chosen one filled. `extra` marks the stock
  // switches, whose "Counted" has no single value of its own.
  const seg = (key, options, val, extra) => `<div class="seg" role="group">${options.map(([ov, ol, cls]) =>
      `<button class="${String(ov) === String(val) ? 'on ' + (cls || '') : ''}" data-set="${key}" data-type="seg"
               data-val="${esc(JSON.stringify(ov))}" ${extra || ''}>${esc(ol)}</button>`).join('')}</div>`;
  const plain = (f, val, off) => {
    const dis = off ? 'disabled tabindex="-1"' : '';
    if (f.type === 'toggle'){
      const on = !!val;
      return `<button class="toggle ${on ? 'on' : 'off'} ${f.danger ? 'danger' : ''}" data-set="${f.key}" data-type="toggle" ${dis}>${esc(on ? (f.onLabel || 'On') : (f.offLabel || 'Off'))}</button>`;
    }
    if (f.type === 'select') return `<select data-set="${f.key}" data-type="select" ${dis}>${f.options.map(([ov, ol]) =>
        `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
    if (f.type === 'number') return `<input type="number" class="mono" data-set="${f.key}" data-type="number" value="${esc(val)}"
                  ${f.min != null ? 'min="'+f.min+'"' : ''} ${f.max != null ? 'max="'+f.max+'"' : ''} ${dis}>`;
    if (f.type === 'time') return `<input type="time" class="mono" data-set="${f.key}" data-type="time" value="${esc(val)}" ${dis}>`;
    return `<input type="text" data-set="${f.key}" data-type="text" value="${esc(val)}" ${f.mono ? 'class="mono"' : ''} ${dis}>`;
  };

  const row = (f) => {
    const val = v(f.key);
    const isPlaceholder = d.placeholders.includes(f.key) && !dirty.includes(f.key);
    let control, below = '';
    if ((d.readonly || []).includes(f.key)){
      control = `<span class="mono" style="font-size:15px">${esc(val)}</span>`;
    } else if (f.type === 'seg'){
      control = seg(f.key, typeof f.options === 'function' ? f.options(d.values) : f.options, val);
    } else if (f.type === 'clock'){
      // Real time or Test time; the slider underneath only counts on Test.
      control = seg(f.key, [[false, 'Real time', 'go'], [true, 'Test time', 'warn']], !!val);
      below = `<div class="full ${val ? '' : 'dimmed'}">${timeSlider(f.time, v(f.time), testRange(v), !val)}</div>`;
    } else if (f.type === 'pair'){
      // On or off, and the one value that goes with it — dimmed when off.
      const on = !!val;
      control = `<div class="ctl">
          ${seg(f.key, [[false, 'Off'], [true, 'On', 'go']], on)}
          <div class="val ${on ? '' : 'dimmed'}">
            ${f.value.before ? `<span class="unit">${esc(f.value.before)}</span>` : ''}
            ${plain(f.value, v(f.value.key), !on)}
            ${f.value.unit ? `<span class="unit">${esc(f.value.unit)}</span>` : ''}
          </div>
        </div>`;
    } else if (f.type === 'count'){
      const counted = countOn(val);
      control = `<div class="ctl">
          ${seg(f.key, [[0, 'Not counted'], ['count', 'Counted', 'go']], counted ? 'count' : 0, 'data-count')}
          <div class="val ${counted ? '' : 'dimmed'}">
            <input type="number" class="mono" min="1" data-set="${f.key}" data-type="count-num"
                   value="${counted ? esc(val) : ''}" placeholder="How many?" ${counted ? '' : 'disabled tabindex="-1"'}>
            <span class="unit">to hand out</span>
          </div>
        </div>`;
    } else if (f.type === 'longtext'){
      // Several lines: the box takes the row's full width, under the label.
      control = '';
      below = `<div class="full"><textarea data-set="${f.key}" data-type="text" rows="${Math.min(24, String(val || '').split('\n').length + 1)}" spellcheck="false">${esc(val)}</textarea></div>`;
    } else if (f.unit){
      control = `<div class="ctl"><div class="val">${plain(f, val)}<span class="unit">${esc(f.unit)}</span></div></div>`;
    } else {
      control = plain(f, val);
    }
    const dim = f.dimIf && f.dimIf(v);
    const help = f.help ? `<div class="h">${esc(f.help)}</div>` : '';
    // A row that can do something as well as hold a value. The test group's
    // is "send it to them again", which used to mean a PowerShell command.
    const send = f.send === 'phone-test'
      ? `<button class="smallbtn setsend" id="sendPhoneTest">Send it now</button>` : '';
    return `<div class="setrow ${isPlaceholder ? 'placeholder' : ''}">
      <div><div class="k">${esc(f.label)}</div>${help}</div>
      <div class="${dim ? 'dimmed' : ''}">${control}${send}</div>
      ${below}
    </div>`;
  };

  return `
  <div class="wide">
    <div class="sub">
      <span class="t">Settings</span>
      <span class="m">${esc(d.placeholders.length)} still to fill in${dirty.length ? ' · ' + dirty.length + ' unsaved' : ''}</span>
    </div>
    <div class="settings">
      ${SETTINGS_SCHEMA.map(g => `
        <div class="setgroup">
          <h3>${esc(g.group)}</h3>
          ${settingFields(g, d).map(row).join('')}
        </div>`).join('')}
      <div class="savebar">
        <span class="n">${dirty.length
          ? esc(dirty.length) + ' change' + (dirty.length === 1 ? '' : 's') + ' not saved yet. Every change goes in the audit log with your name.'
          : 'Everything here is saved. Amber rows still carry a placeholder from the brief.'}</span>
        <button id="saveSettings" ${dirty.length ? '' : 'disabled'}>Save changes</button>
      </div>
    </div>
  </div>`;
};

  </div>`;
};

/* Paperform signs each receipt link to expire 7 days after that person signed
   up, so every current link dies before the event. This card exists to get
   the copies taken while the links still work — which is why it states the
   deadline rather than just offering a button. */
function receiptCard(r){
  if (!r) return '';
  const urgent = r.not_saved > 0;
  return `
  <div class="expcard">
    <div class="t">Receipt copies</div>
    <div class="p">Paperform's links expire seven days after each sign-up — before the event.
    A saved copy lives on this laptop and keeps working on the day, with no tunnel and no Paperform.</div>
    <div class="kv"><span>Receipts on Paperform</span><span class="v">${esc(r.with_links)}</span></div>
    <div class="kv"><span>Copies saved here</span><span class="v">${esc(r.saved)}</span></div>
    <div class="kv"><span>Still to save</span><span class="v" style="color:${urgent ? '#A8231B' : '#1F7A4C'}">${esc(r.not_saved)}</span></div>
    ${r.already_expired ? `<div class="kv"><span>Links already dead</span><span class="v" style="color:#A8231B">${esc(r.already_expired)}</span></div>` : ''}
    ${r.next_expiry ? `<div class="p" style="color:#A8231B;font-weight:700">Next link expires ${esc(r.next_expiry)}.</div>` : ''}
    <button class="dl" id="saveReceipts"><span>${urgent ? 'Save receipt copies' : 'Check again'}</span><span>↧</span></button>
    ${r.already_expired ? `<div class="p">For the dead ones, open Paperform's own dashboard — the files are still there, only the links we were given have expired.</div>` : ''}
  </div>`;
}

function blockedView(){
  return `
  <div class="blocked">
    <div class="t">Not for this sign-in</div>
    <div class="b">Phone sign-ins run the booth, the orders, the game and look people up. Everything else is on the laptop sign-in.</div>
    <div class="c">FORBIDDEN · logged with your station name</div>
  </div>`;
}

function loading(){ return `<div class="blocked"><div class="b">Loading…</div></div>`; }

/* ---- wiring --------------------------------------------------------- */

function wire(){
  root.querySelectorAll('[data-screen]').forEach(b => b.onclick = () => goScreen(b.dataset.screen));
  const so = document.getElementById('signout');
  if (so) so.onclick = signout;

  // booth
  const lookup = document.getElementById('lookup');
  if (lookup) lookup.onclick = doLookup;
  const codebox = document.getElementById('codebox');
  if (codebox){
    codebox.oninput = e => { S.lookupCode = e.target.value; };
    codebox.onkeydown = e => { if (e.key === 'Enter') doLookup(); };
  }
  root.querySelectorAll('[data-hand]').forEach(b => b.onclick = () => {
    const kind = b.dataset.variant || null;
    if (!b.dataset.override){ handOver(b.dataset.hand, null, kind); return; }
    const reason = prompt('Override: why are you handing over ' + b.dataset.label.toLowerCase() + ' without a verified payment? It goes in the log under your name.');
    if (reason && reason.trim()) handOver(b.dataset.hand, reason.trim(), kind);
  });
  const ci = document.getElementById('checkin');
  if (ci) ci.onclick = doCheckin;
  const sn = document.getElementById('scannext');
  if (sn) sn.onclick = () => { scanLocked = false; S.lookup = null; S.lookupCode = ''; render(); startCamera(); };
  // orders
  const os = document.getElementById('orderscan');
  if (os) os.onclick = openOrderScanner;
  const onx = document.getElementById('orderscannext');
  if (onx) onx.onclick = openOrderScanner;
  const ors = document.getElementById('orderrescan');
  if (ors) ors.onclick = () => { scanLocked = false; S.orderScanError = ''; render(); };
  root.querySelectorAll('#orderdone').forEach(b => b.onclick = () => {
    S.orderScan = null; S.orderScanError = ''; S.orderCode = ''; stopCamera(); render(); load();
  });
  const oc = document.getElementById('ordercode');
  if (oc){
    oc.oninput = e => { S.orderCode = e.target.value; };
    oc.onkeydown = e => { if (e.key === 'Enter') orderLookup(S.orderCode); };
  }
  const ol = document.getElementById('orderlookup');
  if (ol) ol.onclick = () => orderLookup(S.orderCode);
  root.querySelectorAll('[data-order-item]').forEach(b => b.onclick = () => placeOrder(b.dataset.orderItem));
  root.querySelectorAll('[data-call]').forEach(b => b.onclick = () => callOrder(Number(b.dataset.call)));
  root.querySelectorAll('[data-collected]').forEach(b => b.onclick = () => closeOrder(Number(b.dataset.collected), 'collected'));
  root.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => closeOrder(Number(b.dataset.cancel), 'cancel'));

  // Scan once: after a read the camera stays off — with a result on screen,
  // and also when the lookup showed nothing. Only "Scan next", tapping the
  // full-screen result, or opening Booth mode again clears the lock.
  if (cameraWanted() && !scanLocked) startCamera();
  else stopCamera();

  // people
  root.querySelectorAll('[data-person]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.person);
    const p = await fetchPerson(id);
    if (!p) return;
    S.selectedPerson = id; S.person = p;
    render();
  });
  // The pager. Opening a page keeps nobody selected from the page you left:
  // `load()` opens the first person on the new page, which is what you want
  // when you are walking a list rather than hunting one name.
  root.querySelectorAll('[data-page]').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    S.peoplePage = Number(b.dataset.page);
    S.selectedPerson = null;
    load();
  });
  const ps = document.getElementById('psearch');
  if (ps){
    let t;
    ps.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => { S.peopleQuery = ps.value.trim(); S.peoplePage = 1;
        S.focusSearch = true; load(); }, 300);
    };
    // Keep typing across the re-render the results cause.
    if (S.focusSearch){
      S.focusSearch = false;
      ps.focus();
      ps.setSelectionRange(ps.value.length, ps.value.length);
    }
  }
  const openr = document.getElementById('openreceipt');
  if (openr) openr.onclick = () => {
    const rc = S.person && S.person.receipt;
    if (rc && rc.link){ window.open(rc.link, '_blank', 'noopener'); return; }
    toast(S.session.role !== 'admin' ? 'Only an admin can open receipts.'
      : rc && rc.expired ? rc.note
      : 'No receipt to open.', 'bad');
  };
  const verify = document.getElementById('verify');
  if (verify) verify.onclick = () => doPayment('verified', null);
  const rej = document.getElementById('rejectpay');
  if (rej) rej.onclick = () => doPayment('rejected', prompt('Reason — the bot quotes this back to them verbatim:'));
  const reopen = document.getElementById('reopen');
  if (reopen) reopen.onclick = () => doPayment('reopen', prompt('Why are you changing the verdict?'));
  const unlink = document.getElementById('unlink');
  if (unlink) unlink.onclick = doUnlink;
  const move = document.getElementById('moveesc');
  if (move) move.onclick = doMove;
  root.querySelectorAll('[data-void]').forEach(b => b.onclick = async () => {
    const reason = prompt('Reason for voiding this ' + b.dataset.item + ' claim (it goes in the log under your name):');
    if (!reason || !reason.trim()) return;
    const r = await api('POST /admin/api/claims/void', { path:'/admin/api/claims/' + b.dataset.void + '/void',
      json:{ reason:reason.trim() } });
    if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
    toast('Voided — they can collect it again. It is in the audit trail.', 'good');
    load();
  });

  // gm
  root.querySelectorAll('[data-gm]').forEach(b => b.onclick = () => gmAction(b.dataset.gm));
  root.querySelectorAll('[data-hint]').forEach(b => b.onclick = () => giveHint(b.dataset.hint));
  root.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    const i = b.dataset.reset; S.resetDone[i] = !S.resetDone[i]; saveResetDone(); render();
  });
  const gmpick = document.getElementById('gmpick');
  // Choosing a game by hand pins the console to it. Otherwise it follows the
  // night: the game that is on, and then the next one.
  if (gmpick) gmpick.onchange = () => { S.gmSlot = gmpick.value; S.gmPinned = true; load(); };

  // gate denials (People)
  root.querySelectorAll('[data-link]').forEach(b => b.onclick = () => resolveDenial(b.dataset.link, 'link'));
  root.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => resolveDenial(b.dataset.dismiss, 'dismiss'));

  // schedules
  root.querySelectorAll('[data-block]').forEach(b => b.onclick = () => toggleBlock(b.dataset.block, b.dataset.blocked === '1'));
  root.querySelectorAll('[data-move]').forEach(b => b.onclick = () => toast('Open the person on People, then "Move to another game".'));

  // roster
  const pick = document.getElementById('pickfile');
  if (pick) pick.onclick = pickRosterFile;
  const drop = document.getElementById('drop');
  if (drop){
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => {
      e.preventDefault(); drop.classList.remove('over');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) previewRoster(f);
    };
  }
  const remap = document.getElementById('remap');
  if (remap) remap.onclick = remapRoster;
  const commit = document.getElementById('commit');
  if (commit) commit.onclick = commitRoster;
  const addW = document.getElementById('addWalkin');
  if (addW) addW.onclick = addWalkin;

  // settings
  root.querySelectorAll('[data-set]').forEach(el => {
    const key = el.dataset.set, type = el.dataset.type;
    if (type === 'toggle'){
      el.onclick = () => {
        S.settingsDraft[key] = !settingValue(key);
        render();
      };
    } else if (type === 'seg'){
      el.onclick = () => {
        const val = JSON.parse(el.dataset.val);
        if (el.hasAttribute('data-count')){
          // Stock: Not counted stores 0; Counted brings back the last number
          // or waits for one to be typed.
          const cur = settingValue(key);
          if (val === 'count'){ if (!countOn(cur)) S.settingsDraft[key] = S.lastCount[key] || ''; }
          else { if (countOn(cur) && cur !== '') S.lastCount[key] = cur; S.settingsDraft[key] = 0; }
        } else {
          S.settingsDraft[key] = val;
        }
        render();
        if (val === 'count'){
          const n = root.querySelector(`[data-set="${key}"][data-type="count-num"]`);
          if (n && !n.value) n.focus();
        }
      };
    } else if (type === 'slider'){
      // While dragging, only the readout changes: redrawing the screen on
      // every step would drop the slider out from under the pointer.
      el.oninput = () => {
        S.settingsDraft[key] = fromMins(el.value);
        const read = root.querySelector(`[data-read="${key}"]`);
        if (read) read.textContent = hhmmLabel(S.settingsDraft[key]);
      };
      el.onchange = () => { S.settingsDraft[key] = fromMins(el.value); render(); };
    } else if (type === 'count-num'){
      el.onchange = () => { S.settingsDraft[key] = el.value === '' ? '' : Number(el.value); render(); };
    } else {
      el.onchange = () => {
        S.settingsDraft[key] = type === 'number' ? Number(el.value) : el.value;
        render();
      };
    }
  });
  root.querySelectorAll('[data-nudge]').forEach(b => b.onclick = () => {
    const key = b.dataset.nudge;
    S.settingsDraft[key] = fromMins(toMins(settingValue(key)) + Number(b.dataset.by));
    render();
  });
  const save = document.getElementById('saveSettings');
  if (save) save.onclick = saveSettings;
  const sendTest = document.getElementById('sendPhoneTest');
  if (sendTest) sendTest.onclick = sendPhoneTest;

  // audit
  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.auditTab = b.dataset.tab; render(); });
  const fa = document.getElementById('fActor');
  if (fa) fa.onchange = () => { S.auditActor = fa.value; load(); };
  const fc = document.getElementById('fAction');
  if (fc) fc.onchange = () => { S.auditAction = fc.value; load(); };
  const fs = document.getElementById('fSearch');
  if (fs){
    let t;
    fs.oninput = () => { S.auditSearch = fs.value; clearTimeout(t); t = setTimeout(load, 300); };
  }
  root.querySelectorAll('[data-export]').forEach(b => b.onclick = () => doExport(b.dataset.export));
  const bn = document.getElementById('backupNow');
  if (bn) bn.onclick = doBackup;
  const sr = document.getElementById('saveReceipts');
  if (sr) sr.onclick = saveReceipts;
}

/* One download per person, so it can run for a while on a slow connection.
   The button says so and locks, because pressing it twice would otherwise
   look like nothing happened. */
async function saveReceipts(){
  const btn = document.getElementById('saveReceipts');
  if (btn){ btn.disabled = true; btn.querySelector('span').textContent = 'Saving…'; }
  const r = await api('POST /admin/api/receipts/archive', { path:'/admin/api/receipts/archive' });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); load(); return; }
  const c = r.data.counts;
  toast(c.saved + ' saved' + (c.skipped ? ', ' + c.skipped + ' already had copies' : '')
        + (c.failed ? ', ' + c.failed + ' failed' : '') + '.', c.failed ? 'bad' : 'good');
  if (c.failed){
    // Name them: a failure here means a payment that cannot be checked later.
    alert('These could not be saved:\n\n'
      + r.data.failed.map(f => '@' + f.handle + ' — ' + f.why).join('\n')
      + '\n\nOpen Paperform’s dashboard for those.');
  }
  load();
}

async function resolveDenial(id, how){

  const r = await api('POST /admin/api/gate-attempts/resolve', {
    path:'/admin/api/gate-attempts/' + id + '/resolve',
    json:{ action:how, attendee_id:how === 'link' ? S.selectedPerson : null } });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  toast(how === 'link' ? 'Linked — they can open the app now.' : 'Dismissed.', 'good');
  load();
}

async function toggleBlock(id, isBlocked){
  let reason = null;
  if (!isBlocked){
    reason = prompt('Block this slot? It disappears from the attendee board straight away.\nWhy? (goes in the audit log)');
    if (!reason || !reason.trim()) return;
  }
  const r = await api('POST /admin/api/slots/block', { path:'/admin/api/slots/' + id + '/block',
    json:{ blocked:!isBlocked, reason } });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  const still = r.data.still_booked || [];
  toast(isBlocked ? 'Unblocked.' : still.length ? 'Blocked. Still booked, move them: ' + still.join(', ') : 'Blocked.',
        still.length && !isBlocked ? 'bad' : 'good');
  load();
}

async function doUnlink(){
  const reason = prompt('Unlink ' + S.person.name + ' from their Telegram account? The next account that opens the app with their username gets linked instead.\nReason (goes in the audit log):');
  if (!reason || !reason.trim()) return;
  const r = await api('POST /admin/api/people/unlink', { path:'/admin/api/people/' + S.selectedPerson + '/unlink',
    json:{ reason:reason.trim() } });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  toast('Unlinked.', 'good');
  load();
}

async function doMove(){
  const sl = await api('GET /admin/api/slots', { path:'/admin/api/slots' });
  if (!sl.ok){ toast(sl.error.message || sl.error.code, 'bad'); return; }
  const open = sl.data.escape.filter(g => !g.blocked && !g.done && g.booked < g.capacity);
  const answer = prompt('Move ' + S.person.name + ' to which game? Type the time.\nOpen: '
    + open.map(g => short(g.starts_at) + ' (' + (g.capacity - g.booked) + ' free)').join(', '));
  if (!answer) return;
  const g = open.find(x => short(x.starts_at) === answer.trim().replace(/\s*(pm|am)$/i, ''));
  if (!g){ toast('No open game at ' + answer + '.', 'bad'); return; }
  const r = await api('POST /admin/api/escape/move', { path:'/admin/api/escape/move',
    json:{ attendee_id:S.selectedPerson, slot_id:g.id, reason:'moved from the People screen' } });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  toast('Moved to ' + fmtIso(r.data.moved_to) + '. They get a message.', 'good');
  load();
}

function pickRosterFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  input.onchange = () => { const f = input.files && input.files[0]; if (f) previewRoster(f); };

async function previewRoster(file){

   file stays on the server, so this costs no second upload — and it makes a
   new run, leaving the one on screen untouched if the admin changes back. */
async function remapRoster(){
  const p = S.rosterPreview;

  const mapping = {};
  document.querySelectorAll('.mapping select[data-field]').forEach(sel => {
    mapping[sel.dataset.field] = sel.value || null;
  });
  const r = await api('POST /admin/api/roster/remap',
    { path:'/admin/api/roster/preview/' + p.run_id + '/mapping', json:{ mapping } });

  S.rosterPreview = r.data;
  render();
  toast('Matched again.', 'good');

async function commitRoster(){
  const p = S.rosterPreview;
  if (!p || p.problems.length) return;
  if (!confirm('Commit ' + (p.counts.new + p.counts.changed) + ' change(s)?'
    + (p.counts.missing ? '\n' + p.counts.missing + ' person(s) missing from this file become inactive.' : ''))) return;
  const r = await api('POST /admin/api/roster/commit', { path:'/admin/api/roster/commit/' + p.run_id });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  toast('Committed: ' + r.data.committed + ' people.', 'good');
  S.rosterPreview = null;
  load();

async function addWalkin(){
  const name = (document.getElementById('wiName') || {}).value || '';
  const handle = (document.getElementById('wiHandle') || {}).value || '';
  if (!name.trim() || !handle.trim()){ toast('Name and username are both needed.', 'bad'); return; }
  const r = await api('POST /admin/api/people', { path:'/admin/api/people',
    json:{ name:name.trim(), handle:handle.trim().replace(/^@/, ''),
           email:((document.getElementById('wiEmail') || {}).value || '').trim(), source:'walk_in' } });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }

async function saveSettings(){
  const changed = {};
  Object.keys(S.settingsDraft).forEach(k => {
    if (String(S.settingsDraft[k]) !== String(S.settings.values[k])) changed[k] = S.settingsDraft[k];
  });
  if (!Object.keys(changed).length) return;
  const blank = SETTINGS_SCHEMA.flatMap(g => settingFields(g, S.settings)).filter(f => f.type === 'count' && changed[f.key] === '');
  if (blank.length){
    toast('Type how many for ' + blank.map(f => f.label.toLowerCase()).join(' and ') + ', or set it back to Not counted.', 'bad');
    return;
  }
  const r = await api('PUT /admin/api/settings', { path:'/admin/api/settings', json:changed });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  const sc = r.data.schedule;
  const warnings = r.data.warnings || [];
  toast('Saved ' + r.data.saved + ' change' + (r.data.saved === 1 ? '' : 's') + '.'
    + (sc ? ' Timetable rebuilt: ' + sc.escape.total + ' games, ' + sc.jam.total + ' jam slots.' : '')
    + phoneTestLine(r.data.phone_test),
    warnings.length ? 'bad' : 'good');
  // A stranded time or an over-full game leaves real people in the wrong
  // place, and a toast that fades is not enough to act on. Say it in a box
  // that has to be dismissed, with the games named.
  if (warnings.length) alert('The timetable changed, but this needs your attention:\n\n' + warnings.join('\n\n'));
  S.settingsDraft = {};
  load();
}

/* Adding somebody to the test group is a request to let them in, and the
   only way in is the bot's message. Say who got it, and name anybody it
   could not reach — silence there looks like it worked. */
/* All four outcomes, each with what to do about it. It used to say only
   "Sent Kai Chen's phone to @them", which it said about somebody who had
   never opened The Yard and about everybody at all while Who gets messages
   was on testing — the two ordinary reasons nothing arrives (23 Sep). */
function phoneTestLine(t){
  if (!t) return '';
  const at = list => list.map(h => '@' + h).join(', ');
  const bits = [];
  if (t.sent && t.sent.length) bits.push('Sent Kai Chen’s phone to ' + at(t.sent) + '.');
  if (t.held && t.held.length){
    bits.push('NOT sent to ' + at(t.held) + ': Who gets messages is on testing, so the bot only writes to '
      + 'the owner. Settings → Who gets messages → Everyone, then Send it now.');
  }
  if (t.unreachable && t.unreachable.length){
    bits.push('NOT sent to ' + at(t.unreachable) + ': '
      + (t.unreachable.length === 1 ? 'they have' : 'they have')
      + ' never opened The Yard, so the bot has no chat to write to. They open @The_YardBot, tap Start, then Send it now.');
  }
  if (t.missing && t.missing.length) bits.push('Not on the roster at all: ' + at(t.missing) + '.');
  return bits.length ? ' ' + bits.join(' ') : '';
}

async function sendPhoneTest(){
  const r = await api('POST /admin/api/gm/phone-test', { path:'/admin/api/gm/phone-test' });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  const line = phoneTestLine(r.data).trim();
  const went = r.data.sent && r.data.sent.length;
  const stuck = (r.data.held || []).length || (r.data.unreachable || []).length;
  toast(line || 'Nobody is in the test group yet.', went && !stuck ? 'good' : went ? 'warn' : 'bad');
}

const CODE_CARDS = ['UNKNOWN_CODE', 'NOT_A_YARD_CODE'];

async function doLookup(code){
  // A camera scan, a paste, and a hand-held scanner that types into the box
  // all arrive as the QR's own text, "YARD:" and all. Strip it in one place so
  // every way in behaves the same, and the box only ever holds the code.
  const raw = (typeof code === 'string' ? code : S.lookupCode || '')
    .trim().toUpperCase().replace(/^YARD:/, '').trim();
  if (!raw) return;
  S.lookupCode = raw;
  // In the box before the lookup answers, so the booth can see what was read
  // and correct a misread by hand instead of guessing at a blank viewfinder.
  const box = document.getElementById('codebox');
  if (box && box.value !== raw) box.value = raw;
  const r = await api('GET /admin/api/lookup', { path:'/admin/api/lookup/' + encodeURIComponent(raw) });
  if (!r.ok && !CODE_CARDS.includes(r.error.code)){
    // Rate limit, network, signed out: say so — it is not a bad code.
    if (S.session) toast(r.error.message || r.error.code, 'bad');
    return;
  }
  S.lookup = r.ok ? { data:r.data } : { error:r.error.code };
  render();
}

function listOf(words){
  return words.length < 2 ? words.join('') : words.slice(0, -1).join(', ') + ' and ' + words[words.length - 1];
}

function label(key){ const i = S.items.find(x => x.key === key); return i ? i.label : key; }

async function handOver(item, overrideReason, variant){
  const json = { code:S.lookupCode, item };
  if (overrideReason) json.override_reason = overrideReason;
  if (variant) json.variant = variant;
  const r = await api('POST /admin/api/claims', { path:'/admin/api/claims', json });
  if (r.ok){
    const st = r.data.stock;
    bigFlash('#1F7A4C', '✓', (r.data.variant_label || label(item)) + ' handed over',
      fmtIso(r.data.at) + ' · ' + r.data.station + ' · ' + r.data.staff
      + (r.data.override ? ' · admin override' : '')
      + (st && st.low ? ' · ' + st.left + ' left' : ''));
  } else if (r.error.code === 'ALREADY_CLAIMED'){
    // Name whoever won, from the server's answer — this screen's own lookup
    // may be older than the other booth's hand-over (§9 r24).
    const c = r.error.claim
      || (S.lookup && S.lookup.data && S.lookup.data.claims[item]) || {};
    const where = [c.station, c.staff].filter(Boolean).join(', ');
    bigFlash('#A8231B', '✕', label(item) + ' already collected',
      (c.at ? 'at ' + fmtIso(c.at) : '') + (where ? ' (' + where + ')' : ''));
  } else if (r.error.code === 'SIGNED_OUT'){
    return;
  } else {
    const map = { PAYMENT_NOT_VERIFIED:'Payment is not verified — you cannot hand over.',
                  OUT_OF_STOCK:'Out of stock.', RATE_LIMITED:'Slow down — too many lookups.' };
    bigFlash('#AE7338', '!', 'Cannot hand over', map[r.error.code] || r.error.message || r.error.code);
  }
}

async function doCheckin(){
  if (!S.lookup || !S.lookup.data) { toast('Look someone up first.', 'bad'); return; }
  const r = await api('POST /admin/api/checkins', { path:'/admin/api/checkins',
    json:{ code:S.lookupCode, kind:'event' } });
  if (r.ok && r.data.already){
    bigFlash('#3C4654', '✓', 'Already checked in',
      fmtIso(r.data.checked_in_at) + (r.data.checked_in_by ? ' · ' + r.data.checked_in_by : ''));
  } else if (r.ok){
    bigFlash('#1F7A4C', '✓', 'Checked in', fmtIso(r.data.checked_in_at) + ' · ' + (r.data.checked_in_by || S.session.name));
  } else if (r.error.code !== 'SIGNED_OUT'){
    toast(r.error.message || r.error.code, 'bad');
  }
}

/* ---- order actions (decision 125) ----------------------------------- */

function openOrderScanner(){
  S.orderScan = 'scan'; S.orderScanError = ''; S.orderCode = ''; scanLocked = false;
  render();
}

/* Who is ordering. The same lookup as the booth — it counts against the same
   limit — but only the person matters here: an order is not a claim, so the
   pass's own state (paid, collected) is not this screen's business. */
async function orderLookup(code){
  const raw = String(code || '').trim().toUpperCase().replace(/^YARD:/, '').trim();
  if (!raw) return;
  S.orderCode = raw;
  const box = document.getElementById('ordercode');
  if (box && box.value !== raw) box.value = raw;
  const r = await api('GET /admin/api/lookup', { path:'/admin/api/lookup/' + encodeURIComponent(raw) });
  if (!r.ok){
    const map = { UNKNOWN_CODE:'Nobody has that code. Check it, or ask their username.',
                  NOT_A_YARD_CODE:"That isn't a Yard pass." };
    if (r.error.code === 'SIGNED_OUT') return;
    S.orderScanError = map[r.error.code] || r.error.message || r.error.code;
    scanLocked = true; render(); return;
  }
  if (r.data.code === 'INACTIVE'){
    S.orderScanError = r.data.person.name + " isn't on the current list. Send them to the front desk.";
    scanLocked = true; render(); return;
  }
  const p = r.data.person;
  S.orderScan = { id:p.id, name:p.name, handle:p.handle, reachable:p.reachable, added:[] };
  S.orderCode = ''; S.orderScanError = '';
  render();
}

async function placeOrder(item){
  const p = S.orderScan;
  if (!p || !p.id) return;
  const r = await api('POST /admin/api/orders', { path:'/admin/api/orders', json:{ attendee_id:p.id, item } });
  if (!r.ok){ if (r.error.code !== 'SIGNED_OUT') toast(r.error.message || r.error.code, 'bad'); return; }
  try { navigator.vibrate && navigator.vibrate(30); } catch (e){}
  p.added.push(r.data.label);
  p.reachable = r.data.person.reachable;
  toast(r.data.label + ' for ' + (r.data.person.first_name || p.name) + ' — on the list.', 'good');
  load();
}

async function callOrder(id){
  const r = await api('POST /admin/api/orders/call', { path:'/admin/api/orders/' + id + '/call' });
  if (!r.ok){ if (r.error.code !== 'SIGNED_OUT') toast(r.error.message || r.error.code, 'bad'); return; }
  const who = r.data.person.first_name || r.data.person.name;
  toast(r.data.repeat ? 'Already called ' + who + ' a moment ago.'
    : r.data.person.reachable ? 'Messaging ' + who + '.' : who + " can't get messages — call their name.",
    r.data.person.reachable || r.data.repeat ? 'good' : 'bad');
  load();
}

async function closeOrder(id, how){
  if (how === 'cancel' && !confirm('Cancel this order? It comes off the list.')) return;
  const r = await api('POST /admin/api/orders/close', { path:'/admin/api/orders/' + id + '/' + how });
  if (!r.ok){ if (r.error.code !== 'SIGNED_OUT') toast(r.error.message || r.error.code, 'bad'); return; }
  load();
}

/* The decoder. Chrome ships BarcodeDetector on Android, macOS and ChromeOS
   only: on Windows and Linux the interface exists but supports no formats, and
   Firefox and desktop Safari have none at all. Asking `in window` therefore
   says yes on the event laptop and then reads nothing, forever, which is what
   a camera that "doesn't detect" looks like from the booth. So ask what it
   actually supports, and decode with jsQR over a canvas when the answer is
   nothing. Both paths take the <video> and give back the QR's text, or null.

   jsQR is fetched only when it is needed, so the booth phones — which have a
   working native detector — never pay for it. */
let jsqrPromise = null, scanCanvas = null, scanCtx = null;

function loadJsQR(){
  if (window.jsQR) return Promise.resolve(true);
  if (jsqrPromise) return jsqrPromise;
  jsqrPromise = new Promise(resolve => {
    const el = document.createElement('script');
    el.src = '/static/jsqr.js';
    el.onload = () => resolve(!!window.jsQR);
    el.onerror = () => resolve(false);
    document.head.appendChild(el);
  });
  return jsqrPromise;
}

async function makeReader(){
  try {
    if (window.BarcodeDetector && BarcodeDetector.getSupportedFormats){
      const formats = await BarcodeDetector.getSupportedFormats();
      if (formats.indexOf('qr_code') !== -1){
        const det = new BarcodeDetector({ formats:['qr_code'] });
        return async (v) => {
          const codes = await det.detect(v);
          return codes.length ? (codes[0].rawValue || '') : null;
        };
      }
    }
  } catch (e){ /* no usable native detector: jsQR below */ }
  if (!(await loadJsQR())) return null;
  return (v) => {
    const w = v.videoWidth, h = v.videoHeight;
    if (!w || !h) return null;
    // Decode a downscaled frame. A pass fills a good part of the viewfinder,
    // so 480px across is plenty to read it and keeps one pass well inside the
    // 400ms between frames on the laptop.
    const scale = Math.min(1, 480 / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    if (!scanCanvas){
      scanCanvas = document.createElement('canvas');
      scanCtx = scanCanvas.getContext('2d', { willReadFrequently:true });
    }
    if (scanCanvas.width !== cw || scanCanvas.height !== ch){
      scanCanvas.width = cw; scanCanvas.height = ch;
    }
    if (!scanCtx) return null;
    scanCtx.drawImage(v, 0, 0, cw, ch);
    const frame = scanCtx.getImageData(0, 0, cw, ch);
    const found = window.jsQR(frame.data, cw, ch, { inversionAttempts:'dontInvert' });
    return found ? found.data : null;
  };
}

/* Camera. Cameras need HTTPS and permission; the typed code box is always
   the fallback (RUNBOOK Phase 18). */
let camStream = null, camLoop = null, readFrame = null;
async function startCamera(){
  const video = document.getElementById('cam');
  const hint = document.getElementById('vfhint');
  if (!video) return;
  // Re-render replaces the <video>, so an existing stream needs re-attaching.
  if (camStream){
    if (!video.srcObject){ video.srcObject = camStream; video.play().catch(() => {}); }
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if (hint) hint.textContent = 'Type the code below';
    return;
  }
  if (camStarting) return;              // "Scan next" and the re-render both ask
  camStarting = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    const v = document.getElementById('cam');
    // Left the screen or got a result while the camera was waking up.
    if (!v || !cameraWanted()){ stream.getTracks().forEach(t => t.stop()); return; }
    camStream = stream;
    scanLocked = false;
    v.srcObject = camStream;
    await v.play();
  } catch (e){
    if (hint) hint.textContent = 'Camera blocked — type the code';
    return;
  } finally {
    camStarting = false;
  }
  if (!readFrame) readFrame = await makeReader();
  if (!readFrame){
    const h0 = document.getElementById('vfhint');
    if (h0) h0.textContent = 'Type the code below';
    return;
  }
  // A decoder that throws on every frame used to do it in silence, 150 times a
  // minute, which is indistinguishable from a camera nobody is pointing at a
  // pass. Give it a couple of seconds, then stop and say so.
  let failures = 0;
  camLoop = setInterval(async () => {
    const v = document.getElementById('cam');
    if (document.hidden || !v || !v.videoWidth) return;
    if (scanLocked) return;
    let raw = null;
    try { raw = await readFrame(v); failures = 0; }
    catch (e){
      if (++failures < 8) return;
      stopCamera();
      const hf = document.getElementById('vfhint');
      if (hf) hf.textContent = 'Scanning failed — type the code';
      return;
    }
    if (!raw || scanLocked) return;
    // One read per scan: lock first, so a decode already in flight can't
    // fire a second lookup for the same QR.
    scanLocked = true;
    stopCamera();
    if (!/^YARD:/.test(raw)){
      if (S.screen === 'orders'){ S.orderScanError = "That QR isn't a Yard pass."; }
      else { S.lookup = { error:'NOT_A_YARD_CODE' }; }
      render();
      return;
    }
    // Both lookups strip the prefix and fill their own box, so a scan lands in
    // the same place a typed code does and can be read off the screen.
    if (S.screen === 'orders'){ await orderLookup(raw); return; }
    await doLookup(raw);
    // A lookup that showed no result (rate limit, network) leaves the camera
    // off; say how to get it back rather than silently re-scanning.
    const h = document.getElementById('vfhint');
    if (!S.lookup && h) h.textContent = 'Tap Scan next to scan again';
  }, 400);
}
let scanLocked = false, camStarting = false;
/* The camera runs on the booth until something is on screen, and on Orders
   only while taking an order. */
function cameraWanted(){
  if (S.screen === 'booth') return !S.lookup;
  if (S.screen === 'orders') return S.orderScan === 'scan';
  return false;
}
function stopCamera(){
  clearInterval(camLoop); camLoop = null;
  if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}

/* ---- payment actions ------------------------------------------------ */

async function doPayment(verdict, reason){
  reason = (reason || '').trim();
  // Marking someone paid needs no words; taking a hand-over away from them
  // does, and a cancelled prompt must not be read as an empty reason.
  if (verdict !== 'verified' && !reason) return;
  const r = await api('POST /admin/api/payment', { path:'/admin/api/people/' + S.selectedPerson + '/payment',
    json:{ verdict, reason } });
  if (!r.ok){
    toast(r.error.message || (r.error.code === 'FORBIDDEN' ? 'Only an admin can do that.' : r.error.code), 'bad');
    return;
  }
  toast('Recorded — it is in the audit trail.', 'good');
  load();
}

/* ---- GM actions ----------------------------------------------------- */

async function gmAction(action){
  const d = S.gmState;
  if (!d) return;
  if (action === 'end' && !confirm("End the game now? Kai Chen's phone stays open until " + short(d.relock_at) + " — use Lock the phone to close it sooner.")) return;
  if (action === 'lock' && !confirm("Lock Kai Chen's phone? Everybody in this game loses it until you unlock it.")) return;
  const r = await api('POST /admin/api/gm/action', { path:'/admin/api/gm/' + d.slot_id + '/' + action });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  load();
}

async function giveHint(key){
  const d = S.gmState;
  const r = await api('POST /admin/api/gm/hint', { path:'/admin/api/gm/' + d.slot_id + '/hints/' + key });
  if (!r.ok){ toast(r.error.message || r.error.code, 'bad'); return; }
  toast(r.data.to_actor ? 'Sent to the actor.' : 'Marked as given — read it out.', 'good');
  load();
}

/* ===================================================================
   3. BOOT
   =================================================================== */

/* Live updates. The server holds one request open and says "something
   changed" within a second (§3 r6: one request per connection, not per
   poll). The screen reloads unless someone is typing on it. If the stream
   can't connect, a 30-second refresh takes over. */
let liveSource = null, liveVersion = null, liveTimer = null;

function typing(){
  const el = document.activeElement;
  return !!el && ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) && el.id !== 'gmpick';
}

function refreshSoon(){
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    if (!S.session || document.hidden) return;
    if (typing() || (S.screen === 'settings' && Object.keys(S.settingsDraft).length)){ refreshSoon(); return; }
    // Not while a camera is open: a redraw would restart the video under
    // someone's thumb. The list catches up the moment they are done.
    if (S.screen !== 'booth' && !(S.screen === 'orders' && S.orderScan === 'scan')) load();
  }, 600);
}

function connectLive(){
  if (liveSource || !S.session || !window.EventSource) return;
  liveSource = new EventSource('/admin/api/live');
  liveSource.onopen = () => { S.live = true; renderChromeOnly(); };
  liveSource.onmessage = e => {
    let v; try { v = JSON.stringify(JSON.parse(e.data).v); } catch (x){ return; }
    if (liveVersion !== null && v !== liveVersion) refreshSoon();
    liveVersion = v;
  };
  liveSource.addEventListener('signed_out', () => { disconnectLive(); endSession('Your sign-in has ended. Sign in again.'); });
  liveSource.onerror = () => { S.live = false; renderChromeOnly(); };
}

function disconnectLive(){
  if (liveSource){ liveSource.close(); liveSource = null; }
  S.live = false; liveVersion = null;
}

function renderChromeOnly(){
  const r = document.querySelector('#chrome .refreshed');
  if (r){ r.className = 'refreshed' + (S.live ? ' on' : ''); r.textContent = S.live ? 'live' : 'updated ' + fmt(now()); }
}

setInterval(() => {
  if (document.hidden || !S.session) return;
  connectLive();
  if (!S.live && !typing() && ['overview', 'person', 'schedules', 'gm'].includes(S.screen)) load();
  if (!S.live && !typing() && S.screen === 'orders' && S.orderScan !== 'scan') load();
}, 30000);

/* The GM timer ticks every second without asking the server. The hints have
   no clock against them since 23 Sep, so there is nothing else in here to
   recolour — the room decides when a hint is due, not a stopwatch. */
setInterval(() => {
  if (S.screen !== 'gm' || !S.gmState) return;
  const d = S.gmState, el = document.getElementById('gmtimer');
  if (!el) return;
  const elapsed = gmElapsed(d);
  el.textContent = mmss(Math.max(0, d.game_seconds - elapsed));
  if (d.started && !d.ended) el.style.color = d.game_seconds - elapsed <= 120 ? '#C4A98A' : '#F2EFE8';
  // A game that has run out, or one whose time has come, is a different
  // game from the one on screen. Ask the server rather than guessing.
  const over = d.started && !d.paused && d.game_seconds - elapsed <= 0;
  if ((over || (!d.started && Date.now() >= gmStartsAt(d))) && Date.now() - S.gmAt > 5000) load();
}, 1000);

/* When the server's picture says this game is done and the GM has not gone
   looking for a particular one, move on to the next. Standing on a finished
   game while the next group walks in was the console's own doing. */
function gmFollowOn(){
  const d = S.gmState;
  if (!d || S.gmPinned) return;
  if (d.state === 'finished' && d.next_game_at){
    const next = d.games.find(g => g.number === d.game_number + 1);
    if (next){ S.gmSlot = String(next.id); load(); }
  }
}

function gmStartsAt(d){ return new Date(d.starts_at).getTime(); }

document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });

render();
resumeSession();
</script>
