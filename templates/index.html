      ${progRow('04', 'Prices', 'What everything costs, and what your entry already covers', 'prices')}
      ${progRow('05', 'Floorplan', 'Where everything is at The Yard', 'floorplan')}
      ${progRow('06', 'Help', 'Lost, stuck, or something looks odd? Click here', 'help')}
    </nav>
  </div>`;
};

/* A menu row: number, big name, and one line saying where it goes.
   The subtitles were added on 19 Sep because the names alone assume you
   already know what the evening contains — "Your pass" means nothing until
   somebody tells you it is the thing you hold up at the counter. */
function progRow(n, title, blurb, view, extra){
  return `<button class="prog-row" data-go="${view}">
    <span class="prog-n label">${n}</span>
    <span class="prog-text">
      <span class="prog-t">${esc(title)}</span>
      <span class="prog-b">${esc(blurb)}</span>
    </span>
    ${extra || ''}
    ${ARROW}
  </button>`;
}

/* The soonest thing booked, or null. */
function nextUp(me){
  const soon = [];
  const b = me.escape_booking;
  if (b && minsUntil(b.ends_at) > 0) soon.push({ at:b.starts_at, what:'The Last Guest' });
  (me.jam_bookings || []).forEach(j => { if (minsUntil(j.ends_at) > 0) soon.push({ at:j.starts_at, what:'The Jamming Studio' }); });
  if (!soon.length) return null;
  soon.sort((x, y) => Date.parse(x.at) - Date.parse(y.at));
  const n = soon[0];
  return { time:fmt(at(n.at)), what:n.what, when:minsUntil(n.at) > 0 ? until(n.at) : 'on now' };
}

/* What the card and the top of Your bookings say. Nothing booked reads
   "None" and "Book something!" in the places a time and a room go, so the
   two layouts are the same shape and the grow works either way. */
function upNextWords(nx){
  return nx || { time:'None', what:'Book something!', when:'' };
}

function upNextCard(nx){
  const w = upNextWords(nx);
  return `<button class="next halftone live" data-go="mybookings">
      <span class="label">Up next</span>
      <span class="num next-time">${esc(w.time)}</span>
      <span class="next-foot">
        <span class="next-what">${esc(w.what)}</span>
        <span class="label next-when">${esc(w.when)}</span>
      </span>
      <span class="next-go label">Manage ${ARROW}</span>
    </button>`;
}

VIEWS.esc = function(){
  const d = S.esc;
  if (!d) return `<div class="night">${skeleton()}</div>`;
  const mine = d.my_booking;
  const cells = d.slots.map((sl, i) => {
    const isMine = mine && mine.slot_id === sl.id;
    let cls = 'game', state;
    if (isMine){ cls += ' mine'; state = 'Yours'; }
    else if (sl.status === 'started'){ cls += ' dim'; state = 'Past'; }
    else if (sl.status === 'blocked'){ cls += ' dim'; state = 'Off'; }
    else if (sl.status === 'closed'){ cls += ' dim'; state = 'Closed'; }
    else if (sl.status === 'full'){ cls += ' dim'; state = 'Full'; }
    else {
      cls += ' live';
      state = sl.seats_left + ' left';
      if (sl.seats_left <= 3) cls += ' low';
    }
    return `<button class="${cls}" data-slot="${sl.id}">
      <span class="num">${esc(short(at(sl.starts_at)))}</span>
      <span class="label">${esc(state)}</span>
    </button>`;
  }).join('');
  const first = d.slots[0], last = d.slots[d.slots.length - 1];
  return `
  <div class="night view">
    <div class="esc-hero halftone">
      <div class="label">Fifteen minutes on the clock</div>
      <h1 class="display esc-title">The Last<br>Guest</h1>
      <!-- Rewritten 19 Sep. The old version stopped at "you have the same
           fifteen", which is a good line and a bad ending: it never says
           what you are meant to do, so it reads as a sentence cut off. It
           now finishes the thought — one of them is lying, find out which. -->
      <p class="esc-prem">Kai Chen hosted four guests. At 10:30 PM he collapsed. All four say they had already left — and one of them is lying.</p>
      <p class="esc-prem">Kai Chen is dead, and everyone who was at his party that night has a reason to lie. The flat is exactly as they left it. Work out who did it, and how you know — the police are fifteen minutes out, and so are you.</p>
    </div>
    <div class="esc-body">
      ${photo('esc', 'The Last Guest')}
      <!-- A way in that is not the bot's message (24 Sep). The message is
           still sent and still works; this is for the phone that swiped it
           away, the person who cleared their chat, and anybody who simply
           looked for it in the app. It only appears once the phone is
           actually open to them, so it can never be a button that refuses. -->
      ${S.phone && !S.phone.code ? `
      <button class="btn btn-bone" data-go="phone" style="margin-bottom:18px">Open Kai Chen’s phone ${ARROW}</button>` : ''}
      <p class="fine" style="margin-top:0;margin-bottom:18px">Come as a group of six. One of you books a time and adds the other five — the flat and the desk each hold half of what you need, so a full group is how the room is meant to be played.</p>
      <div class="bar label"><span>Tonight</span><span>${first ? esc(span(at(first.starts_at), at(last.starts_at))) : ''}</span></div>
      <div class="games">${cells}</div>
    </div>
  </div>`;
};

/* A free time, on its own page (decision 116): the time, who's coming, and
   the Book button in the bottom sheet. The same shape as the jam room's
   second screen, so both rooms book the same way. */
VIEWS.escbook = function(){
  const d = S.esc;
  if (!d) return `<div class="night">${skeleton()}</div>`;
  const sl = d.slots.find(x => x.id === S.pickedSlot);
  // It filled up or closed while they were choosing names.
  if (!sl || sl.status !== 'open') return `
  <div class="night view"><div class="ticket">
    <h1 class="display" style="font-size:44px">That time has gone</h1>
    <button class="btn btn-bone" data-go="esc">Pick another ${ARROW}</button>
  </div></div>`;
  const max = d.max_party || 6;
  const most = Math.min(max, sl.seats_left);
  const me = S.me && S.me.profile;
  const rows = [{ name:'You', sub:me ? '@' + me.handle : '', me:true }]
    .concat(S.draft.map(h => ({
      name:'@' + h, bad:S.badFriends.includes(h),
      edit:`data-redraft="${esc(h)}"`, remove:`data-undraft="${esc(h)}"`
    })));
  return `
  <div class="night view"><div class="ticket">
    <header class="bookhead">
      <div class="tstub-top">
        <span class="label">The Last Guest</span>
        <span class="label">${esc(sl.seats_left)} left</span>
      </div>
      <div class="num tstub-time">${esc(fmt(at(sl.starts_at)))}</div>
    </header>
    ${peopleList({
      head:'Who’s coming', count:rows.length + ' of ' + most, rows,
      add:rows.length < most ? addRow('friendbox', '<button class="prow-add-btn" id="friendadd">Add</button>') : ''
    })}
  </div></div>`;
};

/* The people on a booking: one numbered box each (decision 117). Used by
   both rooms, before booking and after, so there is one way to read "who's
   coming" anywhere in the app.

   Each row: { name, sub, tag, me, locked, bad, warn, edit, remove }
     name    the bold line: "You", a name, or an @handle
     sub     the line under it, usually the @handle
     tag     one word on the right: an instrument, "Booked it", "Taken"
     me      filled, so you can find yourself at a glance
     locked  dimmed and without buttons — not yours to change. Dimmed, not
             blurred: you still need to read who is coming.
     bad     a name the server just refused, ringed red
     edit    attributes for an Edit button (before booking only, 118)
     remove  attributes for the × button
   The last box, when there is room, is the next number with the add box in
   it, so adding somebody reads as filling the next seat. Nothing is checked
   here: the server books everyone or no one, and names who failed. */
function peopleList(o){
  const rows = o.rows.map((r, i) => `
      <li class="prow${r.me ? ' me' : ''}${r.locked ? ' locked' : ''}${r.bad ? ' bad' : ''}">
        <span class="prow-n label">${i + 1}</span>
        <span class="prow-main">
          <span class="prow-name">${esc(r.name)}</span>
          ${r.sub ? `<span class="prow-sub${r.warn ? ' warn' : ''}">${esc(r.sub)}</span>` : ''}
        </span>
        ${r.tag ? `<span class="prow-tag label">${esc(r.tag)}</span>` : ''}
        ${r.edit ? `<button class="prow-edit" ${r.edit}>Edit</button>` : ''}
        ${r.remove ? `<button class="prow-x" ${r.remove} aria-label="Remove ${esc(r.name)}">×</button>` : ''}
      </li>`).join('');
  return `
    <section class="plist-wrap">
      <div class="plist-head">
        <span class="label">${esc(o.head)}</span>
        ${o.count ? `<span class="label plist-count">${esc(o.count)}</span>` : ''}
      </div>
      <ol class="plist">
        ${rows}
        ${o.add ? `
        <li class="prow add">
          <span class="prow-n label">${o.rows.length + 1}</span>
          <div class="prow-addbody">${o.add}</div>
        </li>` : ''}
      </ol>
    </section>`;
}

/* The inside of that last box: "@", the input, the button, and anything
   that belongs with the name being typed (the jam room's instruments). */
function addRow(inputId, button, extra){
  return `
          <div class="prow-add">
            <label class="prow-field">
              <span>@</span>
              <input id="${inputId}" placeholder="add a friend" autocapitalize="off" autocorrect="off" spellcheck="false">
            </label>
            ${button}
          </div>
          ${extra || ''}`;
}

/* "You can change this anytime, until 5 minutes before your booking." The
   number is read off the server's deadline, never typed in, so the sentence
   stays true if the organiser changes the cut-off in Settings. */
function minsBefore(startIso, cutIso){
  return Math.max(0, Math.round((Date.parse(startIso) - Date.parse(cutIso)) / 60000));
}
function beforeLine(verb, startIso, cutIso){
  const m = minsBefore(startIso, cutIso);
  return 'You can ' + verb + ' anytime, until ' + m + (m === 1 ? ' minute' : ' minutes') + ' before your booking.';
}

function cleanHandle(s){
  return String(s || '').trim().replace(/^(https?:\/\/)?(www\.)?(t|telegram)\.me\//i, '')
    .replace(/^@/, '').split(/[/?\s]/)[0].toLowerCase();
}

function draftAdd(){
  const box = document.getElementById('friendbox');
  const h = cleanHandle(box && box.value);
  if (!h) return;
  const mine = S.me && S.me.profile && S.me.profile.handle;
  if (h === mine){ toast("You're already in."); return; }
  if (!S.draft.includes(h)) S.draft.push(h);
  S.badFriends = S.badFriends.filter(x => x !== h);
  box.value = '';
  render();
  const again = document.getElementById('friendbox');
  if (again) again.focus();
}

/* Phone card copy, keyed on the server's code. The device never decides
   whether the phone is open — §9 r21 is the server's call. Shown only on the
   phone's own screen, which the bot's message opens (decision 130). */
function phoneCard(){
  const p = S.phone;
  if (!p) return { title:'Checking', body:'One moment.', openable:false, count:'' };
  switch (p.code){
    case 'NO_BOOKING':
      return { title:'No game booked', body:'Kai Chen’s phone is for the people in a game, once it starts.', openable:false, count:'' };
    case 'PHONE_OFF':
      // A fault, not a setting: the phone's file is missing from the laptop.
      // This used to be an admin switch, and it sent people to a desk that
      // could do nothing about it (23 Sep).
      return { title:'Something\u2019s wrong', body:'Kai Chen\u2019s phone isn\u2019t loading. Tell the game master.', openable:false, count:'' };
    case 'NOT_YET':
      return { title:'Not yet', body:'Kai Chen’s phone opens at your booked time, and we’ll message you the moment it does. Nothing to check in for, nothing to ask anyone.',
               openable:false, count:minsUntil(p.game_starts_at) > 0 ? 'Your game starts ' + until(p.game_starts_at) : '' };
    case 'PHONE_LOCKED':
      return { title:'Locked', body:'The game master has locked Kai Chen’s phone for this game. Ask them.', openable:false, count:'' };
    case 'RELOCKED':
      return { title:'Time’s up', body:'Kai Chen’s phone has closed. Your time is with the game master.', openable:false, count:'' };
    default: {
      // Somebody in Settings -> Test group has no booking and so
      // no time it locks at. "NaN min left" is worse than saying nothing.
      if (p.always && !p.lock_at){
        return { title:'Unlocked', body:'Testing access. It stays open for you, with or without a game.',
                 openable:true, count:'' };
      }
      const left = Math.max(0, minsUntil(p.lock_at));
      return { title:'Unlocked', body:'Messages, calls and photos. Everything you need is on it.',
               openable:true, count:left + ' min left' };
    }
  }
}

/* Kai Chen's phone, on its own screen (decision 130). The bot's message
   is one way here and the escape screen's button is the other; arriving
   from it opens the phone at once. This is what sits behind it — to open it
   again after closing, to reach the browser fallback, or to say why not. */
VIEWS.phone = function(){
  const ph = phoneCard();
  return `
  <div class="night view"><div class="ticket">
    <header>
      <div class="label" style="color:var(--smoke)">The Last Guest</div>
      <h1 class="display" style="font-size:52px; margin-top:8px">Kai Chen’s<br>phone</h1>
    </header>
    <div class="phone">
      <div class="label">Kai Chen’s phone</div>
      <div class="phone-t">${esc(ph.title)}</div>
      <div class="phone-b">${esc(ph.body)}</div>
      ${ph.count ? `<div class="label phone-count">${esc(ph.count)}</div>` : ''}
      ${ph.openable ? `<button class="phone-open" id="openphone">Open Kai Chen’s phone</button>` : ''}
      ${ph.openable ? `<button class="phone-alt" id="openphonetab">Phone not working? Open it in your browser</button>` : ''}
    </div>
  </div></div>`;
};

VIEWS.ticket = function(){
  const me = S.me;
  if (!me) return `<div class="night">${skeleton()}</div>`;
  const b = me.escape_booking;
  if (!b) return `
  <div class="night view"><div class="ticket">
    <h1 class="display" style="font-size:44px">No game booked</h1>
    <button class="btn btn-bone" data-go="esc">Go to the board ${ARROW}</button>
  </div></div>`;
  const owner = b.i_am_owner;
  const starts = at(b.starts_at);
  const arrive = new Date(starts.getTime() - 5 * 60000);
  // The phone arrives as a bot message, so someone we can't message would
  // never get it that way. Say so here, with the fix.
  const noMsgs = me.can_message === false;
  const rows = b.group.map(g => g.me
    ? { name:'You', sub:'@' + g.handle, me:true }
    : { name:g.name,
        sub:!g.reachable ? "Can't get our messages, so tell them yourself" : '@' + g.handle,
        warn:!g.reachable,
        tag:g.owner ? 'Booked it' : '',
        locked:!g.removable,
        remove:g.removable ? `data-unfriend="${esc(g.handle)}"` : '' });
  // One line each, in the organiser's words (decision 119). Changing the
  // group closes 5 minutes out; cancelling closes earlier, so it says so.
  const verb = owner ? 'cancel' : 'leave';
  const changeLine = !owner ? ''
    : !b.locked ? beforeLine('change this', b.starts_at, b.edit_until)
    : 'Changes are closed. Ask the game master at the door.';
  const leaveLine = b.can_leave ? beforeLine(verb, b.starts_at, b.leave_until)
    : !b.locked ? 'Too late to ' + verb + ' here. Ask the game master at the door.' : '';
  return `
  <div class="night view"><div class="ticket">
    ${bookedBanner('escape')}
    <div class="tstub halftone">
      <div class="tstub-top">
        <span class="label">The Last Guest</span>
        <span class="label">${esc(b.ref)}</span>
      </div>
      <div class="num tstub-time">${esc(fmt(starts))}</div>
      <dl class="rows" style="margin:0">
        <div class="row"><dt>Arrive by</dt><dd>${esc(fmt(arrive))}</dd></div>
        <div class="row"><dt>Meet at</dt><dd>${esc(capFirst(ev().escape_meet || 'the escape room entrance'))}</dd></div>
        <div class="row"><dt>Kai Chen’s phone</dt><dd>${S.phone && !S.phone.code ? 'Open now' : 'At ' + esc(fmt(starts))}</dd></div>
        ${!owner ? `<div class="row"><dt>Booked by</dt><dd>@${esc(b.booked_by.handle)}</dd></div>` : ''}
      </dl>
    </div>
    ${noMsgs ? `
    <div class="phone">
      <div class="phone-b">We can’t message you yet — and that’s how Kai Chen’s phone reaches you.</div>
      ${tg && tg.requestWriteAccess
        ? `<button class="btn btn-bone" id="allowmsgs">Allow messages</button>`
        : `<div class="phone-b">Open our bot in Telegram and tap Start.</div>`}
    </div>` : ''}
    <button class="btn btn-quiet" data-go="floorplan">Where is it? ${ARROW}</button>
    ${peopleList({
      head:'Your group', count:b.group.length + ' of ' + b.max_party, rows,
      add:b.can_add ? addRow('friendbox', '<button class="prow-add-btn" id="friendlive">Add</button>') : ''
    })}
    ${changeLine ? `<p class="fine">${esc(changeLine)}</p>` : ''}
    ${leaveLine ? `<p class="fine">${esc(leaveLine)}</p>` : ''}
    ${b.can_leave ? `<button class="btn btn-quiet" id="cancelesc">${owner ? 'Cancel my seat' : 'Leave this game'}</button>` : ''}
  </div></div>`;
};

VIEWS.food = function(){
  const me = S.me;
  if (!me) return skeleton();
  const items = ev().items || [];
  return `
  <div class="page view">
    <div class="pass halftone">
      <img src="${esc(me.pass_qr)}" alt="Your pass QR code">
      <div class="code pass-code">${esc(me.profile.pass_code)}</div>
    </div>
    <div class="items">
      ${items.map(i => itemRow(i, me.claims[i.key] || { claimed:false })).join('')}
    </div>
    ${photo('pass', 'Included with entry')}
  </div>`;
};

/* Whether the booth may hand over is the server's call (§9 r25 — Settings can
   relax it to 'submitted'). */
function canCollect(me){
  return !!me.payment_ok;
}

function openItems(me){
  return (ev().items || []).filter(i => !(me.claims[i.key] || {}).claimed).length;
}

/* "pastry, photo strip and vinyl crafting", from the server's item list. */
function itemsSentence(){
  const n = (ev().items || []).map(i => i.label.toLowerCase());
  return n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}

/* A place from Settings, starting with a capital when it opens a line. */
function capFirst(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

/* A photograph at the top of a screen, if there is one.

   The server only lists files that are actually on the laptop, so a screen
   with no photograph yet renders exactly as it did before — no gap, no
   broken image. Drop a file into static\shots and it appears. The CSS
   turns it greyscale and lays a halftone over it so a photograph belongs to
   the same world as the grain and the stencilled type. */
function photo(name, caption){
  const src = (ev().shots || {})[name];
  if (!src) return '';
  return `<figure class="shot shot-${esc(name)}">
    <img src="${esc(src)}" alt="" decoding="async">
    ${caption ? `<figcaption class="shot-cap label">${esc(caption)}</figcaption>` : ''}
  </figure>`;
}

/* Event facts from the server (Settings), with nothing hard-coded. */
function ev(){
  return (S.me && S.me.event) || (S.session && S.session.event) || {};
}
/* "3–10 PM" from "3:00 PM" and "10:00 PM". */
function hours(){
  const e = ev();
  if (!e.opens) return '';
  const trim = s => s.replace(':00', '');
  const [a, am] = trim(e.opens).split(' '), [b, bm] = trim(e.closes).split(' ');
  return am === bm ? a + '–' + b + ' ' + bm : trim(e.opens) + '–' + trim(e.closes);
}

/* One thing the pass covers: its name, a line saying what it is (the pastry
   lists the kinds), and whether it's still to collect. Once collected, the
   line says which pastry it was. */
function itemRow(item, claim){
  const sub = claim.claimed ? (claim.variant_label || item.note || '') : (item.note || '');
  const text = `<span class="item-text">
      <span class="item-t">${esc(item.label)}</span>
      ${sub ? `<span class="item-s">${esc(sub)}</span>` : ''}
    </span>`;
  if (!claim.claimed){
    return `<div class="item">${text}<span class="pill pill-ok">Scan to claim</span></div>`;
  }
  return `<div class="item done">${text}
    <span class="item-when">Collected<br>${esc(fmt(at(claim.at)))}</span>
  </div>`;
}

/* "You're booked" — shown once, straight after a booking, so nobody wonders. */
function bookedBanner(kind){
  const b = S.booked;
  if (!b || b.kind !== kind) return '';
  S.booked = null;
  const reach = S.me && S.me.can_message
    ? 'We’ve dropped the details in your Telegram.'
    : 'Tap Allow on the home screen and we’ll nudge you.';
  return `<div class="strip strip-ok">
    <div class="grow">
      <div class="strip-t">You’re in</div>
      <div class="strip-b">${esc(b.what)}. Ref ${esc(b.ref)}. ${esc(reach)}</div>
    </div>
  </div>`;
}

/* ---- the jamming studio -------------------------------------------
   Two screens, on purpose. The board picks a time; the second screen picks
   instruments and people. The escape room works the same way, so the shape
   is familiar — but the jam room is set on paper with the instruments as
   big stencilled type, where the escape room is dark and cramped. You should
   know which room you are in before you read a word. */

VIEWS.jam = function(){
  const d = S.jam;
  if (!d) return skeleton();
  const rows = d.slots.map((sl, i) => {
    let cls = 'jamslot', label;
    const free = (sl.free || []).length;
    if (sl.status === 'mine'){ cls += ' mine'; label = 'Yours'; }
    else if (sl.status === 'open'){ cls += ' live'; label = free + ' free'; }
    else { cls += ' dim'; label = { started:'Past', closed:'Closed', blocked:'Off', full:'Full' }[sl.status] || sl.status; }
    return `<button class="${cls}" data-jam="${sl.id}">
      <span class="num">${esc(short(at(sl.starts_at)))}–${esc(short(at(sl.ends_at)))}</span>
      <span class="label">${esc(label)}</span>
    </button>`;
  }).join('');
  return `
  <div class="page view jam-page">
    ${photo('jam', 'The Jamming Studio')}
    <header class="jam-hero">
      <div class="label">Half an hour, the room is yours</div>
      <h1 class="display big jam-head">The Jamming<br>Studio</h1>
      <p class="fine" style="margin-top:12px">Pick a time and claim an instrument. Whoever takes the rest is your band for the night.</p>
    </header>
    <div class="kitlist">
      ${(d.instruments || []).map(i => `<span class="kit">${esc(i.label)}</span>`).join('')}
    </div>
    <div class="bar label"><span>Tonight</span><span>${d.slots.length ? esc(span(at(d.slots[0].starts_at), at(d.slots[d.slots.length-1].ends_at))) : ''}</span></div>
    <div class="jamlist">${rows}</div>
  </div>`;
};

/* The second jam screen: which instrument, and who else is coming. */
VIEWS.jambook = function(){
  const d = S.jam;
  if (!d) return skeleton();
  const sl = (d.slots || []).find(x => x.id === S.pickedJam);
  if (!sl) return skeleton();
  const free = sl.free || [];
  const mine = S.jamPick;
  return `
  <div class="page view jam-page">
    <header class="jam-hero">
      <div class="label">The Jamming Studio</div>

/* Instruments still free for a friend in this slot: not taken by anyone
   already in the room, not yours, and not one you have given someone. */
function jamOpenKits(sl){
  const used = S.jamGuests.map(g => g.instrument);
  return (sl.free || []).filter(k => k !== S.jamPick && !used.includes(k));
}

/* Who's in the room, as one numbered list: the instruments somebody else
   already holds (dimmed — the board says what is taken, not by whom), then
   you, then the friends you are bringing, then the next seat to fill. */
function jamPartyPanel(d, sl){
  const inst = d.instruments || [];
  const label = k => (inst.find(i => i.key === k) || {}).label || k;
  const open = jamOpenKits(sl);
  const me = S.me && S.me.profile;
  const rows = inst.filter(i => !(sl.free || []).includes(i.key))
    .map(i => ({ name:i.label, tag:'Taken', locked:true }))
    .concat([{ name:'You', sub:me ? '@' + me.handle : '', tag:label(S.jamPick), me:true }])
    .concat(S.jamGuests.map(g => ({
      name:'@' + g.handle, tag:label(g.instrument), bad:S.badFriends.includes(g.handle),
      edit:`data-reguest="${esc(g.handle)}"`, remove:`data-unguest="${esc(g.handle)}"`
    })));
  // With one instrument left there is nothing to choose, so it is chosen.
  const pick = S.jamGuestKit || (open.length === 1 ? open[0] : null);
  return `
    <section class="jam-sec">
      ${peopleList({
        head:'In the room', count:rows.length + ' of ' + inst.length, rows,
        add:open.length ? addRow('jambox', '<button class="prow-add-btn" id="jamguestadd">Add</button>',
          `<div class="kitchips">${open.map(k => `<button class="kitchip ${pick === k ? 'on' : ''}" data-guestkit="${esc(k)}">${esc(label(k))}</button>`).join('')}</div>`) : ''
      })}
    </section>`;
}

/* Pinch, double-tap and drag on the map. Pointer events, so one path covers
   touch and a trackpad; `touch-action:none` on the frame stops the webview
   doing its own thing with the gesture first. The map is clamped to the
   frame at every step, so there is no state you can get into where the plan
   is off-screen or smaller than the frame. */
const PLAN = { scale:1, x:0, y:0, min:1, max:5, ratio:0 };
function planApply(img){
  img.style.transform = `translate(${PLAN.x}px, ${PLAN.y}px) scale(${PLAN.scale})`;
}
/* Keep the map inside the frame: at 1x it sits exactly in it, and zoomed in
   you can only pan as far as its own edges. Measured from the map as drawn,
   not from the frame, so a floorplan of another shape (which `object-fit`
   letterboxes) can't be dragged off into the empty band. */
function planClamp(frame){
  const w = frame.clientWidth, h = frame.clientHeight;
  const ar = PLAN.ratio || (w / h);
  const drawnW = Math.min(w, h * ar), drawnH = Math.min(h, w / ar);
  const roomX = Math.max(0, (drawnW * PLAN.scale - w) / 2);
  const roomY = Math.max(0, (drawnH * PLAN.scale - h) / 2);
  PLAN.x = Math.max(-roomX, Math.min(roomX, PLAN.x));
  PLAN.y = Math.max(-roomY, Math.min(roomY, PLAN.y));
}
/* Zoom about a point, so the bit under your fingers stays under them. */
function planZoomAt(frame, scale, px, py){
  const next = Math.max(PLAN.min, Math.min(PLAN.max, scale));
  const r = frame.getBoundingClientRect();
  const cx = px - r.left - r.width / 2, cy = py - r.top - r.height / 2;
  const k = next / PLAN.scale;
  PLAN.x = cx - (cx - PLAN.x) * k;
  PLAN.y = cy - (cy - PLAN.y) * k;
  PLAN.scale = next;
  planClamp(frame);
}
function wirePlan(){
  const frame = document.getElementById('plan');
  const img = document.getElementById('planimg');
  if (!frame || !img) return;
  // The frame takes the map's own shape, so a replaced floorplan of another
  // size still sits in it exactly rather than in a letterboxed strip.
  const fit = () => {
    if (!img.naturalWidth) return;
    frame.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight;
    PLAN.ratio = img.naturalWidth / img.naturalHeight;
  };
  if (img.complete) fit(); else img.addEventListener('load', fit, { once:true });
  planClamp(frame); planApply(img);
  const points = new Map();
  let pinchFrom = 0, scaleFrom = 1;
  const touches = () => [...points.values()];
  const gap = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  frame.addEventListener('pointerdown', (ev) => {
    frame.setPointerCapture(ev.pointerId);
    points.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
    if (points.size === 2){
      const [a, b] = touches();
      pinchFrom = gap(a, b); scaleFrom = PLAN.scale;
    }
  });

  frame.addEventListener('pointermove', (ev) => {
    const was = points.get(ev.pointerId);
    if (!was) return;
    const now = { x:ev.clientX, y:ev.clientY };
    points.set(ev.pointerId, now);
    if (points.size === 2 && pinchFrom){
      const [a, b] = touches();
      const mid = { x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 };
      planZoomAt(frame, scaleFrom * (gap(a, b) / pinchFrom), mid.x, mid.y);
    } else if (points.size === 1 && PLAN.scale > 1){
      PLAN.x += now.x - was.x; PLAN.y += now.y - was.y;
      planClamp(frame);
    }
    planApply(img);
  });

  // Pinch only (23 Sep). A double-tap on a map you are already pinching is a
  // second way to do the same thing, and on a phone it fires by accident:
  // two quick taps while you are working out where you are, and the plan
  // jumps to 2.6x somewhere you were not looking.
  const release = (ev) => {
    points.delete(ev.pointerId);
    if (points.size < 2) pinchFrom = 0;
  };
  frame.addEventListener('pointerup', release);
  frame.addEventListener('pointercancel', release);

  // A trackpad or a mouse wheel, for whoever looks at this on a laptop.
  frame.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    planZoomAt(frame, PLAN.scale * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), ev.clientX, ev.clientY);
    planApply(img);
  }, { passive:false });
}

function skeleton(){ return `<div class="skeleton view">Loading…</div>`; }

/* ---- actions ------------------------------------------------------- */

function wire(){
  screen.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));

  // Help's questions: one open at a time (22 Sep, STATE.md 132). Opening one
  // closes the rest, so the page never turns back into a wall of answers.
  // `name` on <details> does this in newer browsers; this does it in all.
  const faqs = screen.querySelectorAll('.help-faq details');
  faqs.forEach(d => d.addEventListener('toggle', () => {
    if (d.open) faqs.forEach(o => { if (o !== d && o.open) o.open = false; });
  }));

  wirePlan();

  const cta = document.getElementById('gatecta');
  if (cta) cta.onclick = gateTap;

  screen.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.slot);
    const sl = S.esc.slots.find(x => x.id === id);
    const mine = S.esc.my_booking;
    if (mine && mine.slot_id === id) { go('ticket'); return; }
    if (!sl || sl.status !== 'open') return;
    // The server would refuse, so say it now rather than on a page that
    // cannot book.
    if (mine){ toast('You already have a game. Cancel it on your ticket to move.'); return; }
    S.pickedSlot = id;
    S.badFriends = [];
    go('escbook');
  });

  // group booking
  const fb = document.getElementById('friendbox');
  const fadd = document.getElementById('friendadd');
  const flive = document.getElementById('friendlive');
  if (fadd) fadd.onclick = e => { e.preventDefault(); draftAdd(); };
  if (flive) flive.onclick = e => { e.preventDefault(); addFriendLive(); };
  if (fb) fb.onkeydown = e => { if (e.key === 'Enter') (fadd ? draftAdd : addFriendLive)(); };
  screen.querySelectorAll('[data-undraft]').forEach(b => b.onclick = () => {
    S.draft = S.draft.filter(h => h !== b.dataset.undraft);
    S.badFriends = S.badFriends.filter(h => h !== b.dataset.undraft);
    render();
  });
  // Edit, before booking only (decision 118): the name goes back into the
  // box to be fixed. Anything already typed there is added first, so it is
  // never lost.
  screen.querySelectorAll('[data-redraft]').forEach(b => b.onclick = () => {
    const h = b.dataset.redraft;
    if (cleanHandle(fb && fb.value)) draftAdd();
    S.draft = S.draft.filter(x => x !== h);
    S.badFriends = S.badFriends.filter(x => x !== h);
    refillBox('friendbox', h);
  });
  screen.querySelectorAll('[data-reguest]').forEach(b => b.onclick = () => {
    const g = S.jamGuests.find(x => x.handle === b.dataset.reguest);
    if (!g) return;
    S.jamGuests = S.jamGuests.filter(x => x !== g);
    S.badFriends = S.badFriends.filter(x => x !== g.handle);
    S.jamGuestKit = g.instrument;
    refillBox('jambox', g.handle);
  });
  screen.querySelectorAll('[data-unfriend]').forEach(b => b.onclick = () => removeFriend(b.dataset.unfriend));
  const allow = document.getElementById('allowmsgs');
  if (allow) allow.onclick = allowMessages;

  // Picking a time on the jam board opens its own screen, the way the
  // escape room does — rather than growing a panel under the list.
  screen.querySelectorAll('[data-jam]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.jam);
    const sl = S.jam.slots.find(x => x.id === id);
    if (!sl) return;
    // Your own slot opens its ticket, the way your own escape game does.
    if (sl.status === 'mine'){
      const j = ((S.me && S.me.jam_bookings) || []).find(x => x.slot_id === id);
      S.openJam = j ? j.ref : null; S.jamAddKit = null;
      go('jamticket');
      return;
    }
    if (sl.status !== 'open') return;
    S.pickedJam = id; S.jamPick = null; S.jamGuests = []; S.jamGuestKit = null;
    S.badFriends = [];
    go('jambook');
  });
  screen.querySelectorAll('[data-kit]').forEach(b => b.onclick = () => {
    S.jamPick = S.jamPick === b.dataset.kit ? null : b.dataset.kit;
    // Nobody can keep an instrument you have just taken for yourself.
    S.jamGuests = S.jamGuests.filter(g => g.instrument !== S.jamPick);
    if (S.jamGuestKit === S.jamPick) S.jamGuestKit = null;
    render();
  });
  screen.querySelectorAll('[data-guestkit]').forEach(b => b.onclick = () => {
    S.jamGuestKit = S.jamGuestKit === b.dataset.guestkit ? null : b.dataset.guestkit;
    render();
  });
  screen.querySelectorAll('[data-addkit]').forEach(b => b.onclick = () => {
    S.jamAddKit = S.jamAddKit === b.dataset.addkit ? null : b.dataset.addkit;
    render();
  });
  const guestAdd = document.getElementById('jamguestadd');
  if (guestAdd) guestAdd.onclick = draftJamGuest;
  const jb = document.getElementById('jambox');
  if (jb) jb.onkeydown = e => { if (e.key === 'Enter') draftJamGuest(); };
  const jfb = document.getElementById('jamfriendbox');
  const jadd = screen.querySelector('[data-jamadd]');
  if (jfb && jadd) jfb.onkeydown = e => { if (e.key === 'Enter') addJamFriend(jadd.dataset.jamadd); };
  screen.querySelectorAll('[data-unguest]').forEach(b => b.onclick = () => {
    S.jamGuests = S.jamGuests.filter(g => g.handle !== b.dataset.unguest);
    S.badFriends = S.badFriends.filter(h => h !== b.dataset.unguest);
    render();
  });
  screen.querySelectorAll('[data-jamopen]').forEach(b => b.onclick = () => { S.openJam = b.dataset.jamopen; S.jamAddKit = null; go('jamticket'); });
  screen.querySelectorAll('[data-canceljam]').forEach(b => b.onclick = e => { e.stopPropagation(); cancelJam(b.dataset.canceljam); });
  screen.querySelectorAll('[data-leavejam]').forEach(b => b.onclick = e => { e.stopPropagation(); leaveJam(b.dataset.leavejam); });
  screen.querySelectorAll('[data-jamadd]').forEach(b => b.onclick = e => { e.stopPropagation(); addJamFriend(b.dataset.jamadd); });
  screen.querySelectorAll('[data-jamdrop]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [ref, handle] = b.dataset.jamdrop.split('|');
    removeJamFriend(ref, handle);
  });

  const openPhone = document.getElementById('openphone');
  if (openPhone) openPhone.onclick = openThePhone;
  const openTab = document.getElementById('openphonetab');
  if (openTab) openTab.onclick = openPhoneInBrowser;

  const cancel = document.getElementById('cancelesc');
  if (cancel) cancel.onclick = cancelEscape;
}

async function gateTap(){
  if (S.loading) return;
  if (S.gateCode === 'NOT_ON_LIST' && !S.gateSent){
    const input = document.getElementById('claimed');
    const claimed = (input && input.value || '').trim();
    if (claimed){
      S.loading = true; render();
      const r = await api('POST','/api/session/claimed-handle', { json:{ claimed_handle:claimed } });
      S.loading = false;
      if (r.ok){ S.gateSent = true; }
      else toast(r.error.message || r.error.code, true);
      render();
      return;
    }
  }
  if (!S.gateCode){
    go('home');
    // A bot button can ask for a screen (?go=ticket); Back still lands on Home.
    const target = S.goAfter; S.goAfter = null;
    if (target && target !== 'home' && VIEWS[target]) go(target);
    return;
  }
  await startSession();
}

async function startSession(){
  S.loading = true; render();
  const r = await api('POST','/api/session', { json:{ start_param: startParam() } });
  S.loading = false;
  if (r.ok){
    S.session = r.data; S.gateCode = null; S.gateSent = false;
    render();
  } else {
    S.session = null;
    S.gateCode = r.error.code;
    S.gateHandle = r.error.handle
      || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username)
      || null;
    render();
  }
}

function startParam(){
  return (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || null;
}

async function bookEscape(){
  const id = S.pickedSlot;
  if (id == null || S.busy) return;
  // A username typed but not yet added still counts — people forget to tap Add.
  const box = document.getElementById('friendbox');
  const pending = cleanHandle(box && box.value);
  if (pending && !S.draft.includes(pending)) S.draft.push(pending);
  S.busy = true; render();
  const r = await api('POST','/api/escape/bookings', { json:{ slot_id:id, friends:S.draft } });
  S.busy = false;
  if (!r.ok){
    S.badFriends = r.error.handles || [];
    toast(bookingError(r.error), true);
    // A time that went while they were typing: reload, and the page says so.
    if (['SLOT_FULL','SLOT_CLOSED','SLOT_STARTED','SLOT_BLOCKED'].includes(r.error.code)) S.esc = null, loadFor('escbook');
    render();
    return;
  }
  const n = S.draft.length;
  S.pickedSlot = null; S.draft = []; S.badFriends = []; S.me = null; S.esc = null;
  if (!(await loadMe())){ render(); return; }
  S.booked = { kind:'escape', ref:r.data.ref,
    what:'The Last Guest at ' + fmt(at(r.data.starts_at)) + (n ? ', with ' + n + (n === 1 ? ' friend' : ' friends') : '') };
  celebrate();
  // The booking page is replaced, so Back from the ticket lands on the
  // board — the same as the jam room.
  go('ticket', { replace:true });
}

/* A booking is a moment: buzz the phone, and show the confirmation. */
function celebrate(){
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch (e){}
  if (reduceMotion && reduceMotion.matches) return;
  const what = (S.booked && S.booked.what) || '';
  const el = document.createElement('div');
  el.id = 'stamp';
  el.innerHTML = '<div class="stamp-in"><div class="stamp-t">Booked</div>'
    + (what ? '<div class="stamp-b">' + esc(what) + '</div>' : '') + '</div>';
  document.body.appendChild(el);
  clearTimeout(celebrate._a); clearTimeout(celebrate._b);
  celebrate._a = setTimeout(() => el.classList.add('out'), 880);
  celebrate._b = setTimeout(() => el.remove(), 1240);
}

/* Stage a friend and their instrument. Nothing is sent until Book. */
function draftJamGuest(){
  const box = document.getElementById('jambox');
  const h = cleanHandle(box && box.value);
  if (!h){ toast('Type a username first.', true); return; }
  // With one instrument left it is already chosen for them.
  const sl = ((S.jam && S.jam.slots) || []).find(x => x.id === S.pickedJam);
  const open = sl ? jamOpenKits(sl) : [];
  const kit = S.jamGuestKit || (open.length === 1 ? open[0] : null);
  if (!kit){ toast('Pick their instrument too.', true); return; }
  const mine = S.me && S.me.profile && S.me.profile.handle;
  if (h === mine){ toast("You're already in."); return; }
  if (S.jamGuests.some(g => g.handle === h)){ toast('They are already on the list.'); return; }
  box.value = '';
  S.jamGuests.push({ handle:h, instrument:kit });
  S.jamGuestKit = null;
  S.badFriends = S.badFriends.filter(x => x !== h);
  render();
}

async function bookJam(){
  const id = S.pickedJam;
  if (id == null || !S.jamPick || S.busy) return;
  S.busy = true; render();
  // Same all-or-nothing promise as the escape room: the server seats the
  // whole line-up or nobody, and names whoever it could not seat.
  const r = await api('POST','/api/jam/bookings',
    { json:{ slot_id:id, instrument:S.jamPick, friends:S.jamGuests.slice() } });
  S.busy = false;
  if (!r.ok){
    S.badFriends = (r.error.handles || []);
    toast(bookingError(r.error), true);
    // An instrument that went while they were typing is a board problem,
    // not a name problem: reload the board so they can see what is left.
    if (!S.badFriends.length){ S.jam = null; await loadFor('jam'); }
    render();
    return;
  }
  S.pickedJam = null; S.jamPick = null; S.jamGuests = []; S.jamGuestKit = null;
  S.badFriends = []; S.jam = null; S.me = null;
  S.openJam = r.data.ref;
  if (!(await loadMe())){ render(); return; }
  const n = (r.data.friends || []).length;
  S.booked = { kind:'jam', ref:r.data.ref,
    what:'The Jamming Studio, ' + span(at(r.data.starts_at), at(r.data.ends_at))
       + (n ? ', for you and ' + n + (n === 1 ? ' other' : ' others') : '') };
  celebrate();
  go('jamticket', { replace:true, drop:['jambook'] });
}

async function cancelJam(ref){
  if (S.busy) return;
  const j = ((S.me && S.me.jam_bookings) || []).find(x => x.ref === ref);
  const others = j ? (j.group || []).filter(g => !g.me).length : 0;
  const ask = others
    ? 'Cancel this jam slot? ' + others + (others === 1 ? ' other person' : ' other people')
      + ' will be told it is off.'
    : 'Cancel this jam slot? Another group can then book it.';
  if (!(await askConfirm(ask))) return;
  S.busy = true;
  const r = await api('DELETE','/api/jam/bookings/' + encodeURIComponent(ref));
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); return; }
  S.jam = null;
  await loadMe();
  if (S.view === 'jamticket') leaveTicket(); else render();
  toast('Cancelled. Someone else can have it.');
}

/* After a cancel or a leave the ticket no longer exists, so go back to
   wherever it was opened from — the board, or Your bookings — rather than
   to a fixed screen. Opened straight from a bot link, that is Home. */
function leaveTicket(){
  if (S.stack.length) back(); else go('home', { replace:true });
}

/* Someone who was added gives up their own seat. The group carries on
   without them, which is why this is not "cancel". */
async function leaveJam(ref){
  if (S.busy) return;
  if (!(await askConfirm('Leave this jam slot? The rest of the group keeps it.'))) return;
  S.busy = true;
  const r = await api('POST','/api/jam/bookings/' + encodeURIComponent(ref) + '/leave');
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); return; }
  S.jam = null;
  await loadMe();
  if (S.view === 'jamticket') leaveTicket(); else render();
  toast('You’re out. The rest carry on.');
}

async function addJamFriend(ref){
  if (S.busy) return;
  const box = document.getElementById('jamfriendbox');
  const h = cleanHandle(box && box.value);
  if (!h){ toast('Type a username first.', true); return; }
  const j = ((S.me && S.me.jam_bookings) || []).find(x => x.ref === ref);
  const free = (j && j.free) || [];
  const kit = S.jamAddKit || (free.length === 1 ? free[0].key : null);
  if (!kit){ toast('Pick the instrument they will play.', true); return; }
  S.busy = true;
  const r = await api('POST','/api/jam/bookings/' + encodeURIComponent(ref) + '/group',
                      { json:{ players:[{ handle:h, instrument:kit }] } });
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); return; }
  box.value = '';
  S.jamAddKit = null;
  await loadMe(); render();
  toast('Added @' + h + '.');
}

async function removeJamFriend(ref, handle){
  if (S.busy) return;
  if (!(await askConfirm('Remove @' + handle + ' from this slot?'))) return;
  S.busy = true;
  const r = await api('DELETE','/api/jam/bookings/' + encodeURIComponent(ref)
                    + '/group/' + encodeURIComponent(handle));
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); return; }
  await loadMe(); render();
  toast('Removed @' + handle + '.');
}

async function addFriendLive(){
  if (S.busy) return;
  const box = document.getElementById('friendbox');
  const h = cleanHandle(box && box.value);
  if (!h) return;
  S.busy = true;
  const r = await api('POST','/api/escape/group', { json:{ add:[h] } });
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); return; }
  box.value = '';
  await loadMe(); render();
  toast('Added @' + h + '. We’re messaging them.');
}

async function removeFriend(h){
  if (S.busy) return;
  if (!(await askConfirm('Take @' + h + ' off this game? We’ll tell them, and their seat opens up.'))) return;
  S.busy = true;
  const r = await api('DELETE','/api/escape/group/' + encodeURIComponent(h));
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); await loadMe(); render(); return; }
  await loadMe(); render();
  toast('Removed @' + h + '.');
}

function allowMessages(){
  if (!tg || !tg.requestWriteAccess) return;
  tg.requestWriteAccess(async granted => {
    if (!granted){ toast('No problem. Check the app before your game instead.'); return; }
    await api('POST','/api/me/messages', { json:{ allowed:true } });
    if (S.me) S.me.can_message = true;
    render();
    toast('Done. We only message you when it matters.');
  });
}

/* Telegram's own dialog where it exists; window.confirm is unreliable in
   some Telegram WebViews. */
function askConfirm(message){
  return new Promise(resolve => {
    if (tg && tg.showConfirm){
      try { tg.showConfirm(message, ok => resolve(!!ok)); return; } catch (e){ /* fall through */ }
    }
    resolve(window.confirm(message));
  });
}

function bookingError(e){
  // These messages name the usernames or seats involved — say them as sent.
  if (['FRIEND_NOT_ELIGIBLE','FRIEND_ALREADY_BOOKED','LIMIT_REACHED','SLOT_FULL', 'TIME_CONFLICT',
       'FORBIDDEN','SLOT_CLOSED','SLOT_STARTED','NO_BOOKING','ALREADY_BOOKED'].includes(e.code) && e.message) return e.message;
  const map = {
    SLOT_FULL:'That game filled up. Pick another.',
    SLOT_CLOSED:'Booking closed for that game.',
    SLOT_STARTED:'That game has already started.',
    SLOT_BLOCKED:'That game is not running.',
    ALREADY_BOOKED:'You already have a game booked.',
    TIME_CONFLICT:'That clashes with something else you booked.',
    LIMIT_REACHED:'You have reached the limit.',
    FRIEND_NOT_ELIGIBLE:'One of your friends is not on the list, so nobody was booked.',
    FRIEND_ALREADY_BOOKED:'One of your friends already has a game, so nobody was booked.',
    RATE_LIMITED:'Too many tries. Wait a moment.'
  };
  return map[e.code] || e.message || e.code;
}

async function cancelEscape(){
  const b = S.me && S.me.escape_booking;
  if (!b || S.busy) return;
  // What cancelling does to everyone else is said here, at the moment of
  // deciding, rather than in a line of small print under the button.
  const others = (b.group || []).filter(g => !g.me).length;
  const ask = b.i_am_owner
    ? 'Cancel your seat at ' + fmt(at(b.starts_at)) + '?' + (others ? ' Your friends keep theirs.' : '')
    : 'Leave the ' + fmt(at(b.starts_at)) + ' game? We’ll tell @' + b.booked_by.handle + '.';
  if (!(await askConfirm(ask))) return;
  S.busy = true;
  const r = await api('DELETE','/api/escape/bookings/' + b.ref);
  S.busy = false;
  if (!r.ok){ toast(bookingError(r.error), true); return; }
  S.me = null; S.esc = null;
  if (!(await loadMe())){ render(); return; }
  leaveTicket();
}

/* The phone: fetched at the moment of opening, never cached, mounted in
   an iframe from a Blob URL. The server re-runs §9 r21 on arrival. */
async function openThePhone(){
  const res = await api('GET','/api/escape/phone', { raw:true });
  if (!res || !res.ok){
    let code = 'PHONE_LOCKED';
    try { const j = await res.json(); code = j.error.code; } catch (e){}
    S.phone = Object.assign({}, S.phone, { code });
    toast(phoneCard().title, true);
    render();
    return;
  }
  const html = await res.text();
  const url = URL.createObjectURL(new Blob([html], { type:'text/html' }));
  const frame = document.getElementById('phoneframe');
  frame.src = url;
  document.body.classList.add('phoneopen');
  if (tg){ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); tg.BackButton.show(); }
  closeThePhone._url = url;
}
/* §9 r23 — the fallback. Ask the server for a link that works once and dies
   in ninety seconds, then hand it to Telegram to open outside the app. The
   link is fetched at the moment of tapping and never stored: a link sitting
   in a variable would be a spare key, and the point of this one is that it
   cannot be passed to the half of the room that isn't meant to have it. */
async function openPhoneInBrowser(){
  const r = await api('POST','/api/escape/phone/link');
  if (!r.ok){
    S.phone = Object.assign({}, S.phone, { code:r.error.code });
    toast(r.error.message || phoneCard().title, true);
    render();
    return;
  }
  const url = r.data.url || (location.origin + r.data.path);
  /* openLink leaves Telegram for the real browser, which is the entire
     point — the in-app webview is what we are working around. */
  if (tg && tg.openLink) tg.openLink(url, { try_instant_view:false });
  else window.open(url, '_blank', 'noopener');
  toast('Opening in your browser. The link works once, for ' + r.data.seconds + ' seconds.');
}

function closeThePhone(){
  document.body.classList.remove('phoneopen');
  const frame = document.getElementById('phoneframe');
  frame.src = 'about:blank';
  if (closeThePhone._url){ URL.revokeObjectURL(closeThePhone._url); closeThePhone._url = null; }
  if (tg) tg.enableVerticalSwipes && tg.enableVerticalSwipes();
}

/* ---- back, and drag-right-to-go-back ------------------------------- */

document.getElementById('navback').onclick = back;

let sx = null, sy = null;
screen.addEventListener('pointerdown', e => {
  if (S.view === 'gate') return;
  // Left edge only. Starting a drag anywhere meant every press on a slot
  // tile also began a back swipe, and it fought the phone's own gesture.
  if (e.clientX - screen.getBoundingClientRect().left > 36) return;
  // A drag on the floorplan moves the map, it does not go back a screen.
  if (e.target.closest && e.target.closest('.plan')) return;
  sx = e.clientX; sy = e.clientY; S.dragging = true;
});
screen.addEventListener('pointermove', e => {
  if (!S.dragging || sx == null) return;
  const dx = e.clientX - sx, dy = Math.abs(e.clientY - sy);
  if (dy > 34){ S.dragging = false; S.dragX = 0; screen.style.transform = ''; screen.classList.remove('dragging'); return; }
  S.dragX = Math.max(0, Math.min(dx * 0.65, 130));
  // Move the layer directly. This used to call into the render bookkeeping
  // and spend the arrival flag, so the screen the drag led to then arrived
  // with no animation at all.
  screen.style.transform = 'translateX(' + S.dragX + 'px)';
  screen.classList.add('dragging');
});
function endDrag(){
  if (!S.dragging) return;
  const far = S.dragX > 54;
  sx = null; S.dragging = false; S.dragX = 0;
  screen.classList.remove('dragging');
  screen.style.transform = '';
  if (far) back();
}
screen.addEventListener('pointerup', endDrag);
screen.addEventListener('pointercancel', endDrag);

/* ===================================================================
   4. BOOT
   =================================================================== */

// A bot message's button opens /?go=ticket (or food); Start then lands there.
try {
  const go0 = new URLSearchParams(location.search).get('go');
  // `bookings` is the name the bot's messages use. It is the same page as
  // `mybookings`, and naming it once keeps the history stack from treating
  // the two as different screens.
  if (go0 === 'bookings') S.goAfter = 'mybookings';
  else if (['ticket','food','esc'].includes(go0)) S.goAfter = go0;
  // The phone message's button. Not the only way in since 24 Sep — the
  // escape screen has one too — but still the one that opens it on arrival.
  else if (go0 === 'phone'){ S.goAfter = 'phone'; S.phoneAuto = true; }
} catch (e){ /* old WebView: land on Home */ }

/* The in-app browser's layout viewport is taller than the part you can see,
   so a full-screen iframe hangs its last inch under Telegram's own chrome —
   which on the phone is exactly where the dock sits. Telegram reports the
   height that is actually visible; feed it to the frame and re-feed it every
   time the keyboard or the chrome moves. */
function fitPhoneFrame(){
  const root = document.documentElement;
  // Two answers to "how tall is the part you can see", and the frame wants
  // the smaller. Telegram's is the only one that knows about its own chrome;
  // visualViewport is the only one there is outside Telegram, and it is the
  // one that shrinks when a keyboard comes up. Taking the smaller means the
  // frame is never taller than the glass, whichever is reporting.
  const heights = [];
  if (tg && tg.viewportStableHeight > 0) heights.push(tg.viewportStableHeight);
  if (window.visualViewport && window.visualViewport.height > 0) heights.push(window.visualViewport.height);
  if (heights.length) root.style.setProperty('--tgvh', Math.min.apply(null, heights) + 'px');
  // Telegram knows about the cut-outs and bars its own window is sitting
  // under, on devices where the browser will not say. Newer clients only;
  // older ones fall through to env() and the floor.
  const safe = tg && (tg.contentSafeAreaInset || tg.safeAreaInset);
  if (safe){
    if (safe.top >= 0) root.style.setProperty('--tgsafetop', safe.top + 'px');
    if (safe.bottom >= 0) root.style.setProperty('--tgsafebottom', safe.bottom + 'px');
  }
}
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', fitPhoneFrame);
  window.visualViewport.addEventListener('scroll', fitPhoneFrame);
}
fitPhoneFrame();

if (tg){
  tg.ready();
  tg.expand();
  tg.BackButton.onClick(back);
  fitPhoneFrame();
  if (tg.onEvent){
    tg.onEvent('viewportChanged', fitPhoneFrame);
    tg.onEvent('safeAreaChanged', fitPhoneFrame);
    tg.onEvent('contentSafeAreaChanged', fitPhoneFrame);
  }
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  // Telegram's own bars start on paper; render() switches them per screen.
  setChrome(false);
}

/* Countdowns move once a minute. They used to do it by re-rendering the
   whole screen, which threw away every image and replayed every entrance
   animation — the app appeared to reload itself while you were reading it.
   Now the two pieces of text that actually change are written in place.
   No polling (§3 r6), and nothing while the page is hidden. */
function tickCountdowns(){
  const when = screen.querySelector('.next-when');
  if (when && S.me){ const nx = nextUp(S.me); if (nx) when.textContent = nx.when; }
  const count = screen.querySelector('.phone-count');
  if (count && S.phone){ const c = phoneCard().count; if (c) count.textContent = c; }
}
setInterval(() => {
  if (document.hidden) return;
  tickCountdowns();
}, 60000);

startSession().then(() => {
  const sp = startParam();
  if (S.gateCode || !sp) return;
  // A deep link from the bot lands on the screen it points at, with Home
  // seeded behind it so Back still has somewhere sensible to go.
  S.view = 'home';
  S.stack = [];
  if (sp === 'pass') go('food');
  else if (sp === 'phone'){ S.phoneAuto = true; go('phone'); }
});
</script>
</body>
</html>
